<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Image, PDF & Word Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #ffffff; width: 100%; max-width: 600px; padding: 30px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 25px; border-radius: 8px; overflow: hidden; background: #f1f3f5; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; background: none; font-weight: 600; font-size: 14px; color: #555; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #007bff; color: #fff; }
        .section { display: none; }
        .section.active { display: block; }
        .upload-area { border: 2px dashed #007bff; background-color: #f8fbff; padding: 30px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; display: block; }
        .upload-area:hover { background-color: #e6f0ff; }
        .upload-area span { color: #007bff; font-weight: 600; display: block; pointer-events: none; }
        input[type="file"] { display: none; }
        .options { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .options label { cursor: pointer; font-weight: 600; color: #444; font-size: 14px; }
        .file-list { max-height: 200px; overflow-y: auto; text-align: left; margin-bottom: 20px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: #f1f3f5; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; }
        .file-name-container { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .remove-btn { color: #ff4757; font-size: 20px; font-weight: bold; cursor: pointer; line-height: 1; transition: 0.2s; padding-bottom: 2px; }
        .remove-btn:hover { color: #c0392b; transform: scale(1.1); }
        .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; font-size: 13px; color: #333; }
        .status { font-weight: 600; font-size: 12px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
        .pending { background: #ffeaa7; color: #d35400; }
        .processing { background: #81ecec; color: #00b894; }
        .done { background: #55efc4; color: #2d3436; }
        .btn { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); color: white; border: none; padding: 14px 20px; width: 100%; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.9; transform: scale(0.98); }
        #custom-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ff4757; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 9999; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .error-box { color: #d63031; font-size: 13px; margin-top: 10px; font-weight: 600; display: none; }
    </style>
</head>
<body>
    <div id="custom-toast"></div>
    <div class="container">
        <h2>Ultimate Converter</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('imgToPdfTab', this)">Image to PDF</button>
            <button class="tab-btn" onclick="switchTab('pdfToImgTab', this)">PDF to Image</button>
            <button class="tab-btn" onclick="switchTab('toWordTab', this)">To Word (AI)</button>
        </div>
        
        <!-- Image & PDF to PDF Tab -->
        <div id="imgToPdfTab" class="section active">
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">ছবি বা PDF ফাইল সিলেক্ট করুন</p>
            <label for="imageInput" class="upload-area">
                <span>ফাইল সিলেক্ট করতে এখানে ক্লিক করুন</span>
            </label>
            <input type="file" id="imageInput" multiple onchange="handleImageFiles(event)">
            <div class="options" id="imgOptions" style="display: none;">
                <label><input type="radio" name="imgMode" value="single" checked> Single PDF</label>
                <label><input type="radio" name="imgMode" value="separate"> Separate PDFs</label>
            </div>
            <div class="file-list" id="imgFileList"></div>
            <button class="btn" id="convertImgBtn" onclick="convertImagesToPdf()" disabled>Convert to PDF</button>
        </div>

        <!-- PDF to Image Tab -->
        <div id="pdfToImgTab" class="section">
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">একটি PDF ফাইল আপলোড করুন</p>
            <label for="pdfInput" class="upload-area">
                <span>PDF সিলেক্ট করতে এখানে ক্লিক করুন</span>
            </label>
            <input type="file" id="pdfInput" accept="application/pdf" onchange="handlePdfFile(event)">
            <div class="options" id="pdfOptions" style="display: none;">
                <label><input type="radio" name="pdfMode" value="pages" checked> Page by Page</label>
                <label><input type="radio" name="pdfMode" value="long"> Long Image</label>
            </div>
            <div class="file-list" id="pdfFileList"></div>
            <button class="btn" id="convertPdfBtn" onclick="convertPdfToImage()" disabled>Convert to Image</button>
        </div>

        <!-- To Word Tab -->
        <div id="toWordTab" class="section">
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">একটি ছবি বা PDF আপলোড করুন (টেক্সট ও টেবিল এক্সট্র্যাক্ট করতে)</p>
            <label for="wordInput" class="upload-area">
                <span>ফাইল সিলেক্ট করতে এখানে ক্লিক করুন</span>
            </label>
            <input type="file" id="wordInput" accept="image/*,application/pdf" onchange="handleWordFile(event)">
            <div class="file-list" id="wordFileList"></div>
            <button class="btn" id="convertWordBtn" onclick="convertToWord()" disabled>Convert to Word</button>
            <div id="wordErrorBox" class="error-box"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        function showToast(message, isSuccess = false) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = message;
            toast.style.background = isSuccess ? "#2ed573" : "#ff4757";
            toast.style.display = "block";
            setTimeout(() => { toast.style.opacity = "1"; }, 10);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => { toast.style.display = "none"; }, 300);
            }, 4000);
        }

        window.alert = function(msg) { showToast(msg); };

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function downloadDataUrl(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function getBaseName(filename) {
            const lastDotIndex = filename.lastIndexOf('.');
            if (lastDotIndex === -1) return filename;
            return filename.substring(0, lastDotIndex);
        }

        // ================= Image to PDF Logic =================
        const MAX_FILES = 500;
        let selectedFiles = [];

        function renderImageFileList() {
            const list = document.getElementById('imgFileList');
            list.innerHTML = ''; 
            selectedFiles.forEach((file, index) => {
                list.innerHTML += `<div class="file-item">
                    <div class="file-name-container">
                        <span class="remove-btn" title="Remove" onclick="removeImageFile(${index})">&times;</span>
                        <span class="file-name" title="${file.name}">${file.name}</span>
                    </div>
                    <span class="status pending" id="img-status-${index}">অপেক্ষমান</span>
                </div>`;
            });
            document.getElementById('convertImgBtn').disabled = selectedFiles.length === 0;
            if (selectedFiles.length === 0) {
                document.getElementById('imgOptions').style.display = 'none';
            }
        }

        function handleImageFiles(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            if (files.length > MAX_FILES) { 
                showToast(`সর্বোচ্চ ${MAX_FILES} টি ফাইল সিলেক্ট করা যাবে।`); 
                event.target.value = ""; 
                return; 
            }
            selectedFiles = files;
            document.getElementById('imgOptions').style.display = 'flex';
            renderImageFileList();
        }

        function removeImageFile(index) {
            selectedFiles.splice(index, 1);
            renderImageFileList();
            if (selectedFiles.length === 0) {
                document.getElementById('imageInput').value = "";
            }
        }

        function getImageData(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve({ imgData: canvas.toDataURL('image/jpeg', 1.0), width: img.width, height: img.height, orientation: img.width > img.height ? 'l' : 'p' });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function convertImagesToPdf() {
            const btn = document.getElementById('convertImgBtn');
            btn.disabled = true; btn.innerText = "প্রসেস হচ্ছে...";
            const mode = document.querySelector('input[name="imgMode"]:checked').value;
            const { jsPDF } = window.jspdf;
            try {
                if (mode === 'separate') {
                    for (let i = 0; i < selectedFiles.length; i++) {
                        const statusEl = document.getElementById(`img-status-${i}`);
                        statusEl.innerText = "চলছে..."; statusEl.className = "status processing";
                        const file = selectedFiles[i];
                        const originalName = getBaseName(file.name);

                        if (file.type === "application/pdf" || file.name.toLowerCase().endsWith('.pdf')) {
                            const url = URL.createObjectURL(file);
                            downloadDataUrl(url, originalName + '.pdf');
                            URL.revokeObjectURL(url);
                        } else {
                            const { imgData, width, height, orientation } = await getImageData(file);
                            const doc = new jsPDF({ orientation: orientation, unit: 'px', format: [width, height] });
                            doc.addImage(imgData, 'JPEG', 0, 0, width, height);
                            doc.save(originalName + '.pdf');
                        }

                        statusEl.innerText = "সম্পন্ন"; statusEl.className = "status done";
                        await new Promise(r => setTimeout(r, 400)); 
                    }
                } else {
                    let doc = null;
                    let imageCount = 0;
                    for (let i = 0; i < selectedFiles.length; i++) {
                        const statusEl = document.getElementById(`img-status-${i}`);
                        const file = selectedFiles[i];
                        
                        if (file.type === "application/pdf" || file.name.toLowerCase().endsWith('.pdf')) {
                            statusEl.innerText = "স্কিপড (শুধু ইমেজ মার্জ হবে)"; statusEl.className = "status done";
                            continue;
                        }

                        statusEl.innerText = "যোগ হচ্ছে..."; statusEl.className = "status processing";
                        const { imgData, width, height, orientation } = await getImageData(file);
                        
                        if (imageCount === 0) {
                            doc = new jsPDF({ orientation: orientation, unit: 'px', format: [width, height] });
                            doc.addImage(imgData, 'JPEG', 0, 0, width, height);
                        } else {
                            doc.addPage([width, height], orientation);
                            doc.addImage(imgData, 'JPEG', 0, 0, width, height);
                        }
                        imageCount++;
                        statusEl.innerText = "সম্পন্ন"; statusEl.className = "status done";
                        await new Promise(r => setTimeout(r, 200)); 
                    }
                    if (doc) {
                        const originalName = getBaseName(selectedFiles[0].name);
                        doc.save(originalName + '.pdf');
                    } else {
                        showToast("কোনো ছবি পাওয়া যায়নি, শুধু পিডিএফ ফাইল দেওয়া হয়েছে।");
                    }
                }
                showToast("সম্পন্ন হয়েছে!", true);
            } catch (err) {
                showToast("ফাইল প্রসেস করতে সমস্যা হয়েছে!");
            }
            btn.innerText = "সম্পন্ন হয়েছে!";
            setTimeout(() => { 
                btn.innerText = "Convert to PDF"; 
                selectedFiles = []; 
                renderImageFileList(); 
                document.getElementById('imageInput').value = ""; 
            }, 3000);
        }

        // ================= PDF to Image Logic =================
        let selectedPdf = null;

        function handlePdfFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedPdf = file;
            document.getElementById('pdfOptions').style.display = 'flex';
            document.getElementById('pdfFileList').innerHTML = `<div class="file-item">
                <div class="file-name-container">
                    <span class="remove-btn" title="Remove" onclick="removePdfFile()">&times;</span>
                    <span class="file-name" title="${file.name}">${file.name}</span>
                </div>
                <span class="status pending" id="pdf-status">প্রস্তুত</span>
            </div>`;
            document.getElementById('convertPdfBtn').disabled = false;
        }

        function removePdfFile() {
            selectedPdf = null;
            document.getElementById('pdfFileList').innerHTML = '';
            document.getElementById('pdfOptions').style.display = 'none';
            document.getElementById('convertPdfBtn').disabled = true;
            document.getElementById('pdfInput').value = "";
        }

        async function convertPdfToImage() {
            if (!selectedPdf || typeof pdfjsLib === 'undefined') return;
            const btn = document.getElementById('convertPdfBtn');
            const statusEl = document.getElementById('pdf-status');
            btn.disabled = true; btn.innerText = "প্রসেস হচ্ছে...";
            statusEl.innerText = "প্রসেসিং..."; statusEl.className = "status processing";
            const mode = document.querySelector('input[name="pdfMode"]:checked').value;
            const arrayBuffer = await selectedPdf.arrayBuffer();
            try {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const originalName = getBaseName(selectedPdf.name);
                
                if (mode === 'pages') {
                    for (let i = 1; i <= pdf.numPages; i++) {
                        statusEl.innerText = `পেইজ ${i}/${pdf.numPages}...`;
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 2 }); 
                        const canvas = document.createElement('canvas');
                        canvas.height = viewport.height; canvas.width = viewport.width;
                        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                        downloadDataUrl(canvas.toDataURL('image/jpeg', 0.9), `${originalName}_${i}.jpg`);
                        await new Promise(r => setTimeout(r, 600)); 
                    }
                } else {
                    statusEl.innerText = "লম্বা ছবি তৈরি হচ্ছে...";
                    let totalHeight = 0; let maxWidth = 0; const pagesData = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 1.5 });
                        pagesData.push({ page, viewport });
                        totalHeight += viewport.height;
                        if (viewport.width > maxWidth) maxWidth = viewport.width;
                    }
                    const giantCanvas = document.createElement('canvas');
                    giantCanvas.width = maxWidth; giantCanvas.height = totalHeight;
                    const giantCtx = giantCanvas.getContext('2d');
                    let currentY = 0;
                    for (let i = 0; i < pagesData.length; i++) {
                        const { page, viewport } = pagesData[i];
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = viewport.width; tempCanvas.height = viewport.height;
                        await page.render({ canvasContext: tempCanvas.getContext('2d'), viewport: viewport }).promise;
                        giantCtx.drawImage(tempCanvas, 0, currentY);
                        currentY += viewport.height;
                    }
                    downloadDataUrl(giantCanvas.toDataURL('image/jpeg', 0.9), `${originalName}.jpg`);
                }
                statusEl.innerText = "সম্পন্ন"; statusEl.className = "status done"; btn.innerText = "সম্পন্ন হয়েছে!";
                showToast("সফলভাবে ডাউনলোড হয়েছে!", true);
                setTimeout(() => { btn.innerText = "Convert to Image"; removePdfFile(); }, 3000);
            } catch (error) {
                showToast("PDF প্রসেস করতে সমস্যা হয়েছে।"); btn.innerText = "Convert to Image"; btn.disabled = false;
            }
        }

        // ================= To Word Logic =================
        let selectedWordFile = null;

        function handleWordFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedWordFile = file;
            document.getElementById('wordFileList').innerHTML = `<div class="file-item">
                <div class="file-name-container">
                    <span class="remove-btn" title="Remove" onclick="removeWordFile()">&times;</span>
                    <span class="file-name" title="${file.name}">${file.name}</span>
                </div>
                <span class="status pending" id="word-status">প্রস্তুত</span>
            </div>`;
            document.getElementById('convertWordBtn').disabled = false;
            document.getElementById('wordErrorBox').style.display = 'none';
        }

        function removeWordFile() {
            selectedWordFile = null;
            document.getElementById('wordFileList').innerHTML = '';
            document.getElementById('convertWordBtn').disabled = true;
            document.getElementById('wordInput').value = "";
        }

        function getBase64WithoutPrefix(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
                    if ((encoded.length % 4) > 0) {
                        encoded += '='.repeat(4 - (encoded.length % 4));
                    }
                    resolve(encoded);
                };
                reader.onerror = error => reject(error);
            });
        }

        function createWordDoc(htmlContent, filename) {
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title><style>table {border-collapse: collapse; width: 100%;} th, td {border: 1px solid black; padding: 8px; text-align: left;}</style></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + htmlContent + footer;
            const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            downloadDataUrl(url, filename + '.doc');
            setTimeout(() => { URL.revokeObjectURL(url); }, 6000);
        }

        async function convertToWord() {
            if (!selectedWordFile) return;
            const btn = document.getElementById('convertWordBtn');
            const statusEl = document.getElementById('word-status');
            const errorBox = document.getElementById('wordErrorBox');
            btn.disabled = true; 
            errorBox.style.display = 'none';
            const originalName = getBaseName(selectedWordFile.name);
            let mimeType = selectedWordFile.type;
            if (!mimeType || mimeType === "") {
                mimeType = originalName.toLowerCase().endsWith(".pdf") ? "application/pdf" : "image/jpeg";
            }
            try {
                statusEl.innerText = "AI এনালাইজ করছে..."; 
                statusEl.className = "status processing";
                btn.innerText = "ডেটা এক্সট্র্যাক্ট হচ্ছে...";
                const base64Data = await getBase64WithoutPrefix(selectedWordFile);

                const VERCEL_API_URL = "https://merryversegithubio.vercel.app/api/convert";

                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mimeType: mimeType, base64Data: base64Data })
                });
                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                createWordDoc(data.html, originalName);
                statusEl.innerText = "সম্পন্ন"; statusEl.className = "status done";
                btn.innerText = "সফলভাবে সম্পন্ন হয়েছে!";
                showToast("Word ফাইল তৈরি হয়েছে!", true);
                setTimeout(() => { btn.innerText = "Convert to Word"; removeWordFile(); }, 4000);
            } catch (error) {
                console.error(error);
                errorBox.innerText = "ব্যর্থতার কারণ: " + (error.message || "সার্ভারে কানেক্ট করা যাচ্ছে না");
                errorBox.style.display = 'block';
                statusEl.innerText = "ব্যর্থ"; statusEl.className = "status pending";
                btn.innerText = "আবার চেষ্টা করুন";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
