<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Image & PDF Converter</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        
        /* Tabs Design */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f3f5;
        }
        .tab-btn {
            flex: 1; padding: 12px; border: none; background: none;
            font-weight: 600; font-size: 16px; color: #555;
            cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { background: #007bff; color: #fff; }

        .section { display: none; }
        .section.active { display: block; }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #007bff; background-color: #f8fbff;
            padding: 30px 20px; border-radius: 12px; cursor: pointer;
            transition: 0.3s; margin-bottom: 20px; display: block;
        }
        .upload-area:hover { background-color: #e6f0ff; }
        .upload-area span {
            color: #007bff; font-weight: 600; display: block; pointer-events: none;
        }
        input[type="file"] { display: none; }

        /* Options for both sections */
        .options {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
        }
        .options label { cursor: pointer; font-weight: 600; color: #444; font-size: 14px; }

        /* File List */
        .file-list {
            max-height: 200px; overflow-y: auto; text-align: left; margin-bottom: 20px;
        }
        .file-item {
            display: flex; justify-content: space-between; background: #f1f3f5;
            padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; font-size: 14px;
        }
        .status { font-weight: 600; font-size: 12px; padding: 3px 8px; border-radius: 4px; }
        .pending { background: #ffeaa7; color: #d35400; }
        .processing { background: #81ecec; color: #00b894; }
        .done { background: #55efc4; color: #2d3436; }

        /* Button */
        .btn {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white; border: none; padding: 14px 20px; width: 100%;
            font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer;
        }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.9; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ultimate Converter</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('imgToPdfTab', this)">Image to PDF</button>
            <button class="tab-btn" onclick="switchTab('pdfToImgTab', this)">PDF to Image</button>
        </div>

        <!-- 1. Image to PDF Section -->
        <div id="imgToPdfTab" class="section active">
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">যেকোনো ছবি (JPG, PNG) আপলোড করুন (ম্যাক্স ১০০টি)</p>
            
            <label for="imageInput" class="upload-area">
                <span>ছবি সিলেক্ট করতে এখানে ক্লিক করুন</span>
            </label>
            <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageFiles(event)">
            
            <!-- Image to PDF Options -->
            <div class="options" id="imgOptions" style="display: none;">
                <label><input type="radio" name="imgMode" value="single" checked> Single PDF (সবগুলো মিলে ১টি)</label>
                <label><input type="radio" name="imgMode" value="separate"> Separate PDFs (আলাদা আলাদা)</label>
            </div>

            <div class="file-list" id="imgFileList"></div>
            <button class="btn" id="convertImgBtn" onclick="convertImagesToPdf()" disabled>Convert to PDF</button>
        </div>

        <!-- 2. PDF to Image Section -->
        <div id="pdfToImgTab" class="section">
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">একটি PDF ফাইল আপলোড করুন</p>
            
            <label for="pdfInput" class="upload-area">
                <span>PDF সিলেক্ট করতে এখানে ক্লিক করুন</span>
            </label>
            <input type="file" id="pdfInput" accept="application/pdf" onchange="handlePdfFile(event)">
            
            <!-- PDF to Image Options -->
            <div class="options" id="pdfOptions" style="display: none;">
                <label><input type="radio" name="pdfMode" value="pages" checked> Page by Page</label>
                <label><input type="radio" name="pdfMode" value="long"> Long Image</label>
            </div>

            <div class="file-list" id="pdfFileList"></div>
            <button class="btn" id="convertPdfBtn" onclick="convertPdfToImage()" disabled>Convert to Image</button>
        </div>
    </div>

    <!-- Libraries loaded at the bottom -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <script>
        // Setup PDF.js Worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        // --- Tab Logic ---
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // --- SECTION 1: Image to PDF Logic ---
        const MAX_FILES = 100;
        let selectedImages = [];

        function handleImageFiles(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            if (files.length > MAX_FILES) {
                alert(`সর্বোচ্চ ${MAX_FILES} টি ফাইল সিলেক্ট করা যাবে।`);
                event.target.value = ""; return;
            }
            selectedImages = files;
            document.getElementById('imgOptions').style.display = 'flex';
            updateImgList();
        }

        function updateImgList() {
            const list = document.getElementById('imgFileList');
            list.innerHTML = ''; 
            selectedImages.forEach((file, index) => {
                list.innerHTML += `<div class="file-item"><span>${file.name}</span><span class="status pending" id="img-status-${index}">অপেক্ষমান</span></div>`;
            });
            document.getElementById('convertImgBtn').disabled = selectedImages.length === 0;
        }

        // Helper function: Convert image to DataURL & get dimensions
        function getImageData(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const imgData = canvas.toDataURL('image/jpeg', 1.0);
                        let orientation = img.width > img.height ? 'l' : 'p';
                        
                        resolve({ imgData, width: img.width, height: img.height, orientation });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function convertImagesToPdf() {
            const btn = document.getElementById('convertImgBtn');
            btn.disabled = true; btn.innerText = "কনভার্ট হচ্ছে...";

            const mode = document.querySelector('input[name="imgMode"]:checked').value;
            const { jsPDF } = window.jspdf;

            if (mode === 'separate') {
                // Separate PDFs: প্রতিটি ছবির নিজ নিজ নামে সেভ হবে
                for (let i = 0; i < selectedImages.length; i++) {
                    const statusEl = document.getElementById(`img-status-${i}`);
                    statusEl.innerText = "চলছে..."; statusEl.className = "status processing";
                    
                    const { imgData, width, height, orientation } = await getImageData(selectedImages[i]);
                    const doc = new jsPDF({ orientation: orientation, unit: 'px', format: [width, height] });
                    doc.addImage(imgData, 'JPEG', 0, 0, width, height);
                    
                    // ছবির আসল নাম থেকে এক্সটেনশন বাদ দিয়ে .pdf যুক্ত করা
                    const fileName = selectedImages[i].name.replace(/\.[^/.]+$/, "");
                    doc.save(fileName + '.pdf');

                    statusEl.innerText = "সম্পন্ন"; statusEl.className = "status done";
                    await new Promise(r => setTimeout(r, 400)); 
                }
            } else {
                // Single PDF: প্রথম ছবির নাম অনুযায়ী সেভ হবে
                let doc = null;
                for (let i = 0; i < selectedImages.length; i++) {
                    const statusEl = document.getElementById(`img-status-${i}`);
                    statusEl.innerText = "যোগ হচ্ছে..."; statusEl.className = "status processing";

                    const { imgData, width, height, orientation } = await getImageData(selectedImages[i]);

                    if (i === 0) {
                        doc = new jsPDF({ orientation: orientation, unit: 'px', format: [width, height] });
                        doc.addImage(imgData, 'JPEG', 0, 0, width, height);
                    } else {
                        doc.addPage([width, height], orientation);
                        doc.addImage(imgData, 'JPEG', 0, 0, width, height);
                    }

                    statusEl.innerText = "সম্পন্ন"; statusEl.className = "status done";
                    await new Promise(r => setTimeout(r, 200)); 
                }
                
                // প্রথম ছবির নাম বের করে সেটি দিয়ে সেভ করা
                const firstFileName = selectedImages[0].name.replace(/\.[^/.]+$/, "");
                doc.save(firstFileName + '.pdf'); 
            }

            btn.innerText = "সম্পন্ন হয়েছে!";
            setTimeout(() => { 
                btn.innerText = "Convert to PDF"; 
                document.getElementById('imgFileList').innerHTML = ""; 
                document.getElementById('imgOptions').style.display = 'none';
                selectedImages = []; 
                document.getElementById('imageInput').value = ""; 
            }, 3000);
        }

        // --- SECTION 2: PDF to Image Logic ---
        let selectedPdf = null;

        function handlePdfFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedPdf = file;
            
            document.getElementById('pdfOptions').style.display = 'flex';
            document.getElementById('pdfFileList').innerHTML = `<div class="file-item"><span>${file.name}</span><span class="status pending" id="pdf-status">প্রস্তুত</span></div>`;
            document.getElementById('convertPdfBtn').disabled = false;
        }

        function downloadDataUrl(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        async function convertPdfToImage() {
            if (!selectedPdf) return;
            if (typeof pdfjsLib === 'undefined') {
                alert("PDF লাইব্রেরি লোড হয়নি। পেজটি রিফ্রেশ করুন।"); return;
            }

            const btn = document.getElementById('convertPdfBtn');
            const statusEl = document.getElementById('pdf-status');
            btn.disabled = true; btn.innerText = "প্রসেস হচ্ছে...";
            statusEl.innerText = "প্রসেসিং..."; statusEl.className = "status processing";

            const mode = document.querySelector('input[name="pdfMode"]:checked').value;
            const arrayBuffer = await selectedPdf.arrayBuffer();
            
            try {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const numPages = pdf.numPages;
                
                // পিডিএফ এর আসল নাম বের করা (এক্সটেনশন ছাড়া)
                const originalName = selectedPdf.name.replace(/\.[^/.]+$/, "");

                if (mode === 'pages') {
                    for (let i = 1; i <= numPages; i++) {
                        statusEl.innerText = `পেইজ ${i}/${numPages} কনভার্ট হচ্ছে...`;
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 2 }); 
                        
                        const canvas = document.createElement('canvas');
                        canvas.height = viewport.height; canvas.width = viewport.width;
                        const ctx = canvas.getContext('2d');
                        
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        // পিডিএফ এর নাম অনুযায়ী ছবির নাম (ওভাররাইট ঠেকাতে page number যুক্ত করা)
                        downloadDataUrl(canvas.toDataURL('image/jpeg', 0.9), `${originalName}_page_${i}.jpg`);
                        await new Promise(r => setTimeout(r, 600)); 
                    }
                } else {
                    statusEl.innerText = "লম্বা ছবি তৈরি হচ্ছে...";
                    let totalHeight = 0; let maxWidth = 0;
                    const pagesData = [];

                    for (let i = 1; i <= numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 1.5 });
                        pagesData.push({ page, viewport });
                        totalHeight += viewport.height;
                        if (viewport.width > maxWidth) maxWidth = viewport.width;
                    }

                    const giantCanvas = document.createElement('canvas');
                    giantCanvas.width = maxWidth; giantCanvas.height = totalHeight;
                    const giantCtx = giantCanvas.getContext('2d');
                    let currentY = 0;

                    for (let i = 0; i < pagesData.length; i++) {
                        const { page, viewport } = pagesData[i];
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = viewport.width; tempCanvas.height = viewport.height;
                        const tempCtx = tempCanvas.getContext('2d');
                        
                        await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;
                        giantCtx.drawImage(tempCanvas, 0, currentY);
                        currentY += viewport.height;
                    }
                    
                    // পিডিএফ এর নাম অনুযায়ী লম্বা ছবির নাম
                    downloadDataUrl(giantCanvas.toDataURL('image/jpeg', 0.9), `${originalName}_long_image.jpg`);
                }

                statusEl.innerText = "সম্পন্ন"; statusEl.className = "status done";
                btn.innerText = "সফলভাবে সম্পন্ন হয়েছে!";
                
                setTimeout(() => {
                    btn.innerText = "Convert to Image";
                    document.getElementById('pdfFileList').innerHTML = "";
                    document.getElementById('pdfOptions').style.display = 'none';
                    document.getElementById('pdfInput').value = "";
                    selectedPdf = null;
                }, 4000);

            } catch (error) {
                alert("PDF প্রসেস করতে সমস্যা হয়েছে।");
                btn.innerText = "Convert to Image"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
