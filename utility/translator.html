<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translator & Smart Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #ffffff; width: 100%; max-width: 600px; padding: 30px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; }
        h2 { color: #333; margin-bottom: 20px; font-weight: 600; }
        .tabs { display: flex; margin-bottom: 25px; border-radius: 8px; overflow: hidden; background: #f1f3f5; }
        .tab-btn { flex: 1; padding: 12px 5px; border: none; background: none; font-weight: 600; font-size: 15px; color: #555; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #007bff; color: #fff; }
        .section { display: none; text-align: left; }
        .section.active { display: block; }
        
        .input-box { width: 100%; padding: 15px; border: 2px solid #e1e8ed; border-radius: 10px; font-size: 15px; font-family: 'Poppins', sans-serif; outline: none; transition: 0.3s; margin-bottom: 15px; resize: vertical; }
        .input-box:focus { border-color: #007bff; }
        .flex-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; outline: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; background: #fff; }
        
        .btn { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); color: white; border: none; padding: 14px 20px; width: 100%; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.9; transform: scale(0.98); }
        
        .output-box { background: #f8fbff; border: 1px solid #cce5ff; border-radius: 10px; padding: 15px; font-size: 15px; color: #333; display: none; }
        .output-title { font-weight: 600; font-size: 14px; color: #007bff; margin-bottom: 10px; display: block; border-bottom: 1px solid #cce5ff; padding-bottom: 5px; }
        .result-text { white-space: pre-wrap; line-height: 1.6; word-wrap: break-word; }
        
        #custom-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ff4757; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 9999; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .error-box { color: #d63031; font-size: 13px; margin-top: 10px; font-weight: 600; display: none; text-align: center; }
        
        .dict-word { color: #007bff; font-size: 20px; font-weight: bold; margin-bottom: 10px; font-family: 'Poppins', sans-serif; }
        .dict-item { margin-bottom: 8px; }
        .dict-label { font-weight: 600; color: #444; }
    </style>
</head>
<body>
    <div id="custom-toast"></div>
    <div class="container">
        <h2>AI Translator & Dictionary</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('translatorTab', this)">AI Translator</button>
            <button class="tab-btn" onclick="switchTab('dictionaryTab', this)">Smart Dictionary</button>
        </div>

        <!-- Translator Section -->
        <div id="translatorTab" class="section active">
            <div class="flex-row">
                <select id="sourceLang">
                    <option value="Auto Detect">Auto Detect</option>
                    <option value="English">English</option>
                    <option value="Bengali">Bengali (বাংলা)</option>
                    <option value="Arabic">Arabic (العربية)</option>
                    <option value="Hindi">Hindi (हिन्दी)</option>
                    <option value="Urdu">Urdu (اردو)</option>
                    <option value="Persian">Persian (فارسی)</option>
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                    <option value="Italian">Italian</option>
                    <option value="Portuguese">Portuguese</option>
                    <option value="Russian">Russian</option>
                    <option value="Chinese">Chinese (Simplified)</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Korean">Korean</option>
                    <option value="Turkish">Turkish</option>
                    <option value="Indonesian">Indonesian</option>
                    <option value="Thai">Thai</option>
                    <option value="Vietnamese">Vietnamese</option>
                </select>
                <span style="font-weight: bold; color: #888;">&rarr;</span>
                <select id="targetLang">
                    <option value="English">English</option>
                    <option value="Bengali" selected>Bengali (বাংলা)</option>
                    <option value="Arabic">Arabic (العربية)</option>
                    <option value="Hindi">Hindi (हिन्दी)</option>
                    <option value="Urdu">Urdu (اردو)</option>
                    <option value="Persian">Persian (فارسی)</option>
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                    <option value="Italian">Italian</option>
                    <option value="Portuguese">Portuguese</option>
                    <option value="Russian">Russian</option>
                    <option value="Chinese">Chinese (Simplified)</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Korean">Korean</option>
                    <option value="Turkish">Turkish</option>
                    <option value="Indonesian">Indonesian</option>
                    <option value="Thai">Thai</option>
                    <option value="Vietnamese">Vietnamese</option>
                </select>
            </div>
            <textarea id="sourceText" class="input-box" rows="4" placeholder="Enter text here..."></textarea>
            <button class="btn" id="translateBtn" onclick="processTranslate()">Translate</button>
            <div id="transErrorBox" class="error-box"></div>
            
            <div id="transOutputContainer" class="output-box">
                <span class="output-title">Translation Result:</span>
                <div id="transResult" class="result-text"></div>
            </div>
        </div>

        <!-- Dictionary Section -->
        <div id="dictionaryTab" class="section">
            <div class="flex-row">
                <label style="color: #555; font-weight: 600; font-size: 14px; flex: 1;">Meaning & Details In:</label>
                <select id="dictTargetLang" style="flex: 1;">
                    <option value="Bengali" selected>Bengali (বাংলা)</option>
                    <option value="English">English</option>
                    <option value="Arabic">Arabic (العربية)</option>
                    <option value="Hindi">Hindi (हिन्दी)</option>
                    <option value="Urdu">Urdu (اردو)</option>
                    <option value="Persian">Persian (فارسی)</option>
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                    <option value="Chinese">Chinese</option>
                    <option value="Japanese">Japanese</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="wordInput" class="input-box" style="margin-bottom: 0;" placeholder="Search Word / Phrase...">
                <button class="btn" id="dictBtn" onclick="processDictionary()" style="width: auto; margin-bottom: 0; padding: 0 25px;">Search</button>
            </div>
            <div id="dictErrorBox" class="error-box"></div>
            
            <div id="dictOutputContainer" class="output-box">
                <span class="output-title">Word Details:</span>
                <div id="dictResult" class="result-text"></div>
            </div>
        </div>
    </div>

    <script>
        const VERCEL_API_URL = "https://merryversegithubio.vercel.app/api/translator";

        function showToast(message, isSuccess = false) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = message;
            toast.style.background = isSuccess ? "#2ed573" : "#ff4757";
            toast.style.display = "block";
            setTimeout(() => { toast.style.opacity = "1"; }, 10);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => { toast.style.display = "none"; }, 300);
            }, 4000);
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        async function fetchAI(data, btnElement, defaultBtnText, outputContainer, resultDiv, errorBox) {
            btnElement.disabled = true;
            btnElement.innerText = "Processing...";
            errorBox.style.display = 'none';
            outputContainer.style.display = 'block';
            resultDiv.innerHTML = '<span style="color: #888;">AI is analyzing, please wait...</span>';

            try {
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const resData = await response.json();
                
                if (resData.error) {
                    throw new Error(resData.error);
                }
                
                // Removing any accidental extra spaces/newlines around the result to fix gap issue
                resultDiv.innerHTML = resData.result.trim();
                showToast("Action completed successfully!", true);
                
            } catch (error) {
                console.error(error);
                errorBox.innerText = "Error: " + (error.message || "Failed to connect to server.");
                errorBox.style.display = 'block';
                resultDiv.innerHTML = "";
                outputContainer.style.display = 'none';
            } finally {
                btnElement.innerText = defaultBtnText;
                btnElement.disabled = false;
            }
        }

        function processTranslate() {
            const text = document.getElementById('sourceText').value.trim();
            const srcLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            
            if (!text) {
                showToast("Please enter some text!");
                return;
            }
            const btn = document.getElementById('translateBtn');
            const outputCont = document.getElementById('transOutputContainer');
            const resDiv = document.getElementById('transResult');
            const errBox = document.getElementById('transErrorBox');
            
            fetchAI({ mode: "translate", text: text, sourceLang: srcLang, targetLang: targetLang }, btn, "Translate", outputCont, resDiv, errBox);
        }

        function processDictionary() {
            const word = document.getElementById('wordInput').value.trim();
            const dictLang = document.getElementById('dictTargetLang').value;
            
            if (!word) {
                showToast("Please enter a word!");
                return;
            }
            const btn = document.getElementById('dictBtn');
            const outputCont = document.getElementById('dictOutputContainer');
            const resDiv = document.getElementById('dictResult');
            const errBox = document.getElementById('dictErrorBox');
            
            fetchAI({ mode: "dictionary", text: word, targetLang: dictLang }, btn, "Search", outputCont, resDiv, errBox);
        }
    </script>
</body>
</html>
