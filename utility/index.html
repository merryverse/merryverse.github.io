<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full py-6 px-8 max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <span class="font-semibold text-lg tracking-tight text-slate-800">UtilityHub</span>
        </div>
        <span class="text-xs text-slate-500 font-medium bg-slate-200/60 px-3 py-1 rounded-full">Online Toolkit</span>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full flex flex-col justify-center">

        <!-- Cards Container -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto w-full">
            
            <!-- PDF Converter Card -->
            <a href="pdf-converter.html" class="group bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-indigo-500/40 transition-all duration-200 flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 rounded-xl bg-red-50 text-red-500 flex items-center justify-center text-xl mb-4 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-slate-800 mb-1 group-hover:text-indigo-600 transition-colors">PDF Converter</h2>
                    <p class="text-slate-500 text-xs md:text-sm leading-relaxed">
                        Convert, merge, and manage documents seamlessly.
                    </p>
                </div>
                <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-medium text-indigo-600">
                    <span>Open tool</span>
                    <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

            <!-- AI Translator Card -->
            <a href="translator.html" class="group bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-indigo-500/40 transition-all duration-200 flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center text-xl mb-4 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-language"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-slate-800 mb-1 group-hover:text-indigo-600 transition-colors">AI Translator</h2>
                    <p class="text-slate-500 text-xs md:text-sm leading-relaxed">
                        Translate text accurately across multiple languages using modern AI.
                    </p>
                </div>
                <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-medium text-indigo-600">
                    <span>Open tool</span>
                    <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 px-8 max-w-5xl mx-auto text-center text-xs text-slate-400 border-t border-slate-200/60">
        &copy; 2026 MerryVerse. All rights reserved.
    </footer>

</body>
</html>
