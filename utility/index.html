
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101323">
<title>Utility Tools</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: linear-gradient(150deg, #191a36, #101323 60%, #102b30);
    color: #f8f8ff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 28px 18px;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 52px;
}

.logo {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: linear-gradient(135deg, #927aff, #39d9c5);
    color: #101323;
    font-size: 23px;
    font-weight: 800;
}

.brand {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1px;
}

.brand span {
    color: #70eddb;
}

/* Intro */
.eyebrow {
    color: #a99aff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 13px;
}

h1 {
    font-size: 39px;
    line-height: 1.12;
    letter-spacing: -1.8px;
    margin-bottom: 13px;
}

.description {
    color: #aeb3ca;
    font-size: 14px;
    line-height: 1.7;
}

/* Tools */
.tools {
    margin-top: 38px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.section-title h2 {
    font-size: 16px;
}

.count {
    font-size: 11px;
    color: #c3c7dc;
    border: 1px solid #ffffff20;
    padding: 5px 10px;
    border-radius: 20px;
}

.tool-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 14px;
    min-height: 100px;
    margin-bottom: 13px;
    border: 1px solid #ffffff18;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.055);
    color: inherit;
    text-decoration: none;
    transition: transform 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
}

.tool-card:active {
    transform: scale(0.98);
    background: rgba(255, 255, 255, 0.10);
}

.tool-icon {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    font-size: 25px;
}

.pdf-icon {
    color: #b7a8ff;
    background: #9b83ff20;
    border: 1px solid #9b83ff30;
}

.translate-icon {
    color: #70eddb;
    background: #42dfca18;
    border: 1px solid #42dfca30;
}

.tool-info {
    flex: 1;
    min-width: 0;
}

.tool-info h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 5px;
    letter-spacing: -0.3px;
}

.tool-info p {
    font-size: 12px;
    line-height: 1.5;
    color: #aeb3ca;
}

.arrow {
    color: #e5e5f7;
    font-size: 22px;
    flex-shrink: 0;
}

/* Footer */
.footer {
    text-align: center;
    color: #777e9d;
    font-size: 11px;
    margin-top: 38px;
    padding-bottom: 15px;
}

/* Larger screens */
@media (min-width: 600px) {
    .container {
        padding-top: 40px;
    }

    .header {
        margin-bottom: 60px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">✦</div>
        <div class="brand">
            UTILITY <span>TOOLS</span>
        </div>
    </header>

    <section>
        <p class="eyebrow">YOUR EVERYDAY TOOLKIT</p>

        <h1>
            Useful tools.<br>
            Made simple.
        </h1>

        <p class="description">
            Choose a tool below to get started.
        </p>
    </section>

    <section class="tools">

        <div class="section-title">
            <h2>Your tools</h2>
            <span class="count">2 TOOLS</span>
        </div>

        <!-- Image to PDF Converter -->
        <a href="pdf-converter.html" class="tool-card">

            <div class="tool-icon pdf-icon">
                📄
            </div>

            <div class="tool-info">
                <h3>Image to PDF Converter</h3>
                <p>Convert your images into a PDF file.</p>
            </div>

            <span class="arrow">›</span>

        </a>

        <!-- AI Translator -->
        <a href="translator.html" class="tool-card">

            <div class="tool-icon translate-icon">
                🌐
            </div>

            <div class="tool-info">
                <h3>AI Translator</h3>
                <p>Translate text into another language.</p>
            </div>

            <span class="arrow">›</span>

        </a>

    </section>

    <footer class="footer">
        Simple tools for everyday tasks
    </footer>

</div>

</body>
</html>
