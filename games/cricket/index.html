let AC;

function tone(f,d,ty='square',v=.07,sl=0,w=0){
 if(!AC||S.mute)return;
 const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+w;
 o.type=ty;o.frequency.setValueAtTime(f,n);
 if(sl)o.frequency.exponentialRampToValueAtTime(M.max(30,f+sl),n+d);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
 o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);
}
function noise(d,v){
 if(!AC||S.mute)return;
 const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<a.length;i++)a[i]=(rnd()*2-1)*(1-i/a.length);
 const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start();
}

// ---------- teams ----------
const TEAMS=[
 ['Bangladesh','BAN',80,79,'#006a4e','#f42a41','#004d38'],
 ['India','IND',88,86,'#1565c0','#ff9800','#0d47a1'],
 ['Pakistan','PAK',84,85,'#1b5e20','#cddc39','#0f3d13'],
 ['Australia','AUS',87,87,'#f9a825','#1b5e20','#c17900'],
 ['England','ENG',86,83,'#c62828','#1a237e','#8e0000'],
 ['South Africa','RSA',85,86,'#2e7d32','#fbc02d','#1b5e20'],
 ['New Zealand','NZL',82,84,'#263238','#00bcd4','#11171a'],
 ['Sri Lanka','SRI',78,79,'#1e3c8a','#ffc107','#102357']
].map(([n,c,ba,bo,col,acc,pants])=>({n,c,ba,bo,col,acc,pants}));

const FN=['Liton','Shakib','Tamim','Taskin','Miraz','Rohit','Virat','Bumrah','Babar','Shaheen','Rizwan','Head','Starc','Smith','Root','Stokes','Buttler','Rabada','Markram','Kane','Boult','Pathum','Hasaranga','Mushfiq'];
const LN=['Das','Hasan','Iqbal','Ahmed','Hossain','Sharma','Kohli','Singh','Azam','Afridi','Khan','Warner','Cummins','Maxwell','Brook','Wood','Archer','Klaasen','Miller','Southee','Santner','Mendis','Perera','Rahim'];
const pn=(t,i)=>FN[(t*5+i*3)%FN.length][0]+'. '+LN[(t*7+i*5+i)%LN.length];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ovs=b=>(b/6|0)+'.'+b%6,FMT={T20:'T20',ODI:'ONE DAY',TEST:'TEST'};

// ---------- match engine ----------
function newMatch(a,b,fmt,first){
 const o=first==a?b:a;
 const m={fmt,a,b,ord:fmt=='TEST'?[first,o,first,o]:[first,o],cur:0,inn:[],maxB:{T20:120,ODI:300,TEST:0}[fmt],done:false,res:null,tb:0,startT:Date.now()};
 startInn(m);return m;
}
function startInn(m){
 const bt=m.ord[m.cur],bw=bt==m.a?m.b:m.a;let target=null;
 if(m.fmt!='TEST'&&m.cur==1)target=m.inn[0].r+1;
 if(m.fmt=='TEST'&&m.cur==3)target=m.inn[0].r+m.inn[2].r-m.inn[1].r+1;
 m.inn.push({bt,bw,r:0,w:0,b:0,target,bat:[...Array(11)].map(()=>({r:0,b:0,o:0,h:''})),st:0,ns:1,nx:2,ov:[],fow:[]});
}
function applyBall(m,o){
 const n=m.inn[m.cur],s=n.bat[n.st];n.b++;m.tb++;s.b++;n.r+=o.r;s.r+=o.r;n.ov.push(o.w?'W':o.r);
 if(o.w){n.w++;s.o=1;s.h=o.k;n.fow.push(n.r);if(n.w<10)n.st=n.nx++}
 else if(o.r%2){const t=n.st;n.st=n.ns;n.ns=t}
 if(n.b%6==0){const t=n.st;n.st=n.ns;n.ns=t;n.ov=[]}
 let end=n.w>=10||(m.maxB&&n.b>=m.maxB)||(n.target&&n.r>=n.target);
 if(m.fmt=='TEST'&&m.tb>=2700&&!end){end=true;m.cap=true}
 if(end)endInn(m);return end;
}
function endInn(m){
 const T=m.fmt=='TEST';m.cur++;
 if((!T&&m.cur>=2)||(T&&m.cur>=4)||m.cap)return finish(m);
 if(T&&m.cur==3&&m.inn[0].r+m.inn[2].r<=m.inn[1].r){m.by=1;return finish(m)}
 startInn(m);
}
function finish(m){
 m.done=true;const T=m.fmt=='TEST',c=t=>TEAMS[t].c;let w=-1,t='';
 if(!T){
  const f=m.inn[0],s=m.inn[1];
  if(s.r>=s.target){w=s.bt;t=c(w)+' won by '+(10-s.w)+' wickets'}
  else if(s.r==f.r)t='Match tied';
  else{w=f.bt;t=c(w)+' won by '+(f.r-s.r)+' runs'}
 }else if(m.by){
  w=m.ord[1];t=c(w)+' won by an innings and '+(m.inn[1].r-m.inn[0].r-m.inn[2].r)+' runs';
 }else if(m.cap||m.inn.length<4)t='Match drawn';
 else{
  const f=m.inn[3];
  if(f.r>=f.target){w=f.bt;t=c(w)+' won by '+(10-f.w)+' wickets'}
  else if(f.r==f.target-1)t='Match tied';
  else{w=m.ord[0];t=c(w)+' won by '+(f.target-1-f.r)+' runs'}
 }
 m.res={w,t};
}
function aggr(m){
 const n=m.inn[m.cur],ov=n.b/6,F=m.fmt;let a=1;
 if(F=='T20')a=ov<6?1.15:ov>=16?1.3:1;else if(F=='ODI')a=ov<10?.9:ov>=40?1.35:1;
 if(n.target&&F!='TEST'){const left=m.maxB-n.b,rr=(n.target-n.r)/M.max(1,left)*6,cr=n.b?n.r/n.b*6:rr;if(rr>cr+2)a*=1.3;else if(rr<cr-1.5)a*=.85}
 if(F=='TEST'&&n.target)a=1.1;return a;
}
function wts(m,adjBat=0,adjBowl=0){
 const n=m.inn[m.cur],d=(TEAMS[n.bt].ba+adjBat-(TEAMS[n.bw].bo+adjBowl))/40,a=aggr(m);
 const b={T20:[32,32,8,1,12,6,4.2],ODI:[36,35,8,1,9,3,2.8],TEST:[58,24,4,.5,6,.8,1.6]}[m.fmt];
 return[b[0]*(1-d*.3)/M.sqrt(a),b[1],b[2],b[3],b[4]*(1+d*.9)*a,b[5]*(1+d*1.1)*a,b[6]*(1-d*.8)*(.9*a+.1)];
}
function pickW(w){const t=w.reduce((a,b)=>a+M.max(0,b),0);let r=rnd()*t;for(let i=0;i<w.length;i++){r-=M.max(0,w[i]);if(r<=0)return i}return 0}
const VAL=[0,1,2,3,4,6],outFrom=i=>i==6?{r:0,w:1,k:rnd()<.55?'c':'b'}:{r:VAL[i],w:0};
const simBall=m=>outFrom(pickW(wts(m)));
function simMatch(a,b,fmt){const m=newMatch(a,b,fmt,rnd()<.5?a:b);let g=0;while(!m.done&&g++<20000)applyBall(m,simBall(m));return m}

// Bowling & Batting outcome calculations (tuned for generous 4s and 6s!)
function userBowl(m,bx,by,acc){
 const goodSpot=(by>.42&&by<.68)||(by>.84);
 const adj=(acc-.45)*55+(goodSpot?8:0);
 const w=wts(m,0,adj);
 if(by>.84){w[6]*=1.35;w[4]*=1.15;if(acc<.45)w[4]*=1.45}
 else if(by<.25){w[5]*=1.25;w[6]*=1.2;if(acc<.45)w[5]*=1.5}
 if(acc<.3){w[4]*=1.5;w[5]*=1.4}
 const o=outFrom(pickW(w));
 if(o.w&&by>.76&&M.abs(bx)<.36)o.k='b';
 return o;
}

// Rewarding probability tables for batting [0, 1, 2, 3, 4, 6, W]
const TB={
 // Lofted shots (U): High 4s and 6s!
 U2:[0, 2, 4, 1, 34, 58, 1],
 U1:[2, 12, 10, 2, 38, 30, 6],
 U0:[16, 18, 8, 0, 16, 10, 32],
 // Grounded attacking drives/cuts/pulls (G): High 4s and safe runs!
 G2:[1, 10, 12, 3, 66, 7, 1],
 G1:[6, 26, 20, 3, 38, 3, 4],
 G0:[28, 28, 12, 0, 14, 0, 18]
};

function userBat(m,L){
 const n=m.inn[m.cur],dW=(TEAMS[n.bw].bo-TEAMS[n.bt].ba)/100*.3,p=L.press;
 // Ball passes stumps if endX is near center [-0.28..0.28] and not too short
 const hittingStumps=M.abs(L.endX)<.28&&L.by>.32;
 // Batsman reach position: batX is center of batsman, bat extends to the right (+0.22)
 const batReachX=L.batX+0.12;
 const distX=M.abs(L.endX-batReachX);

 if(!p){
  // Left the ball without swinging
  if(hittingStumps&&distX>.25&&rnd()<.48)return{r:0,w:1,k:'b',timing:'BOWLED!'};
  if(hittingStumps&&distX<=.25)return{r:0,w:0,timing:'BLOCKED'};
  return{r:0,w:0,timing:'WELL LEFT'};
 }

 // Forgiving timing window around L.dur
 const err=(p.t-L.dur)/.30;
 if(M.abs(err)>1.22||distX>.72){
  // Complete swing and miss
  if(hittingStumps&&rnd()<.38+dW)return{r:0,w:1,k:'b',timing:distX>.72?'MISSED LINE!':err<0?'TOO EARLY!':'TOO LATE!'};
  return{r:0,w:0,timing:distX>.72?'TOO WIDE!':err<0?'EARLY!':'LATE!'};
 }

 // Calculate shot quality (0..1) from timing + footwork positioning
 let q=1-M.abs(err)*.65-M.max(0,distX-.22)*.6;
 if(distX<.24)q+=.18; // Great footwork bonus!
 q=cl(q,0,1);

 const tier=q>.66?2:q>.36?1:0;
 const mode=L.loft?'U':'G';
 const w=TB[mode+tier].slice();
 w[6]*=M.max(.2,1+dW*1.4);

 const o=outFrom(pickW(w));
 if(o.w)o.k=L.loft?'c':(tier==0&&hittingStumps&&rnd()<.55)?'b':'c';
 o.timing=tier==2?'PERFECT TIMING!':tier==1?'SWEET TIMING!':'OK CONTACT';
 o.q=q;
 return o;
}

// ---------- competitions ----------
function newComp(type,fmt){
 const oth=shuf(TEAMS.map((_,i)=>i).filter(i=>i!=S.team));let groups;
 if(type=='tour')groups=[[S.team,...oth.slice(0,5)]];
 else{const all=shuf([S.team,...oth]);groups=[all.slice(0,4),all.slice(4)]}
 const fix=[];groups.forEach(g=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)fix.push({a:g[i],b:g[j],w:null})});
 return{kind:'comp',type,fmt,groups,fix:shuf(fix),stage:'L',ko:[],champ:-1};
}
function tbl(c,g){
 return g.map(t=>{
  let p=0,w=0,pt=0;
  for(const f of c.fix)if(f.w!=null&&(f.a==t||f.b==t)){p++;if(f.w==t){w++;pt+=2}else if(f.w<0)pt++}
  return{t,p,w,pt};
 }).sort((x,y)=>y.pt-x.pt||y.w-x.w||(TEAMS[y.t].ba+TEAMS[y.t].bo)-(TEAMS[x.t].ba+TEAMS[x.t].bo));
}
function recFix(c,f,m){f.w=m.res.w;f.t=m.res.t;if(f.w<0&&c.stage!='L'){f.w=rnd()<.5?f.a:f.b;f.t+=' (super over: '+TEAMS[f.w].c+')'}}
function compAdv(c){
 for(;;){
  const L=c.stage=='L'?c.fix:c.ko,nx=L.find(f=>f.w==null);
  if(nx){if(nx.a==S.team||nx.b==S.team)return nx;recFix(c,nx,simMatch(nx.a,nx.b,c.fmt));continue}
  if(c.stage=='L'){
   const q=c.groups.map(g=>tbl(c,g).map(r=>r.t));
   c.ko=c.groups.length==1?[{a:q[0][0],b:q[0][3],w:null},{a:q[0][1],b:q[0][2],w:null}]:[{a:q[0][0],b:q[1][1],w:null},{a:q[1][0],b:q[0][1],w:null}];
   c.stage='S';continue;
  }
  if(c.stage=='S'){c.ko=[{a:c.ko[0].w,b:c.ko[1].w,w:null}];c.stage='F';continue}
  if(c.stage=='F'){c.champ=c.ko[0].w;c.stage='D'}
  return null;
 }
}

let lv=null;
const held={L:0,R:0,U:0,D:0};
const FLD_BASE=[
 [-.42,.22],[.42,.22],[-.76,-.05],[.76,-.05],
 [-.38,-.52],[.38,-.52],[.02,-.78],[-.58,.58],[.58,.58]
];

function startLive(ctx,first){
 const m=newMatch(ctx.a,ctx.b,ctx.fmt,first);
 lv={m,ctx,u:ctx.a,ph:'stance',t:0,batX:-.18,walkPhase:0,shotDir:0,loft:true,bx:0,by:.55,swing:0,ci:0,msg:'',big:'',bigT:0};
 st='play';hideUI();root.classList.add('pl');beginBall();
}
const bats=()=>lv.m.inn[lv.m.cur].bt==lv.u;

function beginBall(){
 const L=lv;
 L.press=null;L.out=null;L.acc=0;L.big='';L.bounced=false;L.stepTick=0;L.tapTick=.35;
 $('#ok').textContent=bats()?'HIT':'BOWL';
 if(bats()){
  // Calm pre-ball stance phase (1.35s) before bowler starts running
  L.ph='stance';L.t=0;
  // Bowler chooses bounce spot
  L.bx=(rnd()-.5)*1.05;
  L.by=.24+rnd()*.62;
  L.swing=(rnd()-.5)*.36;
  L.endX=cl(L.bx+L.swing*(1-L.by*.4),-0.95,0.95);
 }else{
  L.ph='spot';L.t=0;
  L.bx=cl(L.bx,-.85,.85);L.by=cl(L.by,.18,.9);
  L.batX=-.18;
 }
}

function startBowlRunup(){
 const L=lv;
 L.ph='runup';L.t=0;L.stepTick=0;
 if(!bats()){
  L.swing=(L.bx>0?-.22:.22)+(rnd()-.5)*.18;
  L.endX=cl(L.bx+L.swing*(1-L.by*.4),-0.95,0.95);
 }
}

function release(){
 const L=lv;
 L.ph='flight';L.t=0;
 // Realistic ball flight duration (1.32s - 1.48s) so player can move & time shots comfortably
 L.dur=1.32+rnd()*.16+(L.by<.35?.10:0);
 L.bounced=false;
 sfx.whoosh();
}

function triggerHit(){
 const L=lv;
 if(L.press)return;
 // Determine shot direction from held keys, or auto-select smartly from ball line relative to batsman
 let dir=L.shotDir;
 if(held.L)dir=-1;
 else if(held.R)dir=1;
 else if(dir===0){
  const rel=L.endX-(L.batX+.12);
  dir=rel<-.12?-1:rel>.12?1:0;
 }
 // If user pressed slightly early during flight (e.g. after bounce), queue/snap timing gently toward arrival
 const snapT=L.t>L.dur*.58&&L.t<L.dur*.88?lerp(L.t,L.dur,.45):L.t;
 L.press={t:snapT,rawT:L.t,dir,loft:L.loft};
}

function okPress(){
 if(st!='play'||!lv)return;
 const L=lv;
 if(bats()){
  if(L.ph=='flight'&&!L.press){
   triggerHit();
  }else if(L.ph=='runup'&&L.t>.8){
   // Pre-triggering just before release still sets ready state
  }else if((L.ph=='outfield'||L.ph=='pitch_res')&&L.t>1.4){
   L.t=99;
  }
 }else{
  if(L.ph=='spot'){
   sfx.tick();L.ph='aim';L.t=0;L.meter=.5;
  }else if(L.ph=='aim'){
   L.acc=1-M.abs(L.meter-.5)*2;
   sfx.tick();startBowlRunup();
  }else if((L.ph=='outfield'||L.ph=='pitch_res')&&L.t>1.4){
   L.t=99;
  }
 }
}

function dirTap(k){
 if(st!='play'||!lv)return;
 const L=lv;
 if(bats()){
  if(k=='U'){L.loft=true;L.shotDir=0;sfx.tick()}
  else if(k=='D'){L.loft=false;L.shotDir=0;sfx.tick()}
  else if(k=='L'){
   L.shotDir=-1;
   L.batX=cl(L.batX-.09,-.82,.68);
   L.walkPhase+=.9;
  }else if(k=='R'){
   L.shotDir=1;
   L.batX=cl(L.batX+.09,-.82,.68);
   L.walkPhase+=.9;
  }
 }else if(L.ph=='spot'){
  sfx.tick();
  const dx=k=='L'?-.14:k=='R'?.14:0;
  const dy=k=='U'?-.10:k=='D'?.10:0;
  L.bx=cl(L.bx+dx,-.85,.85);
  L.by=cl(L.by+dy,.16,.92);
 }
}

function resolve(){
 const L=lv,m=L.m;let o;
 if(bats())o=userBat(m,L);
 else{
  o=userBowl(m,L.bx,L.by,L.acc);
  if(o.r>0||(o.w&&o.k=='c')){
   L.press={t:L.dur,rawT:L.dur,dir:L.endX<0?-1:L.endX>.2?1:0,loft:o.r==6||(o.w&&o.k=='c')};
  }
 }
 L.out=o;L.t=0;

 const stayedOnPitch=(o.w&&o.k=='b')||(!o.w&&o.r==0&&!L.press);

 if(stayedOnPitch){
  L.ph='pitch_res';
  L.resDur=2.4;
 }else{
  L.ph='outfield';
  L.resDur=3.1; // Plenty of time to enjoy the shot, fielder chase & batsmen running!
  const pDir=L.press?L.press.dir:0;
  // Aim shot into realistic gaps in the field so 4s and 6s look natural!
  let baseAng;
  if(pDir<0)baseAng=M.PI*(0.82+(rnd()-.5)*.38); // Pull / Mid-wicket / Fine leg
  else if(pDir>0)baseAng=M.PI*(0.18+(rnd()-.5)*.38); // Cover drive / Square cut / Point
  else baseAng=M.PI*(0.5+(rnd()-.5)*.32); // Straight drive / Long on / Long off

  const ux=M.cos(baseAng),uy=-M.sin(baseAng)*(rnd()<.18?-0.6:1);
  const distFactor=o.w?.58:o.r==6?1.18:o.r==4?1.04:o.r==3?.82:o.r==2?.64:o.r==1?.44:.22;
  const ORX=390,ORY=205,OCX=480,OCY=285;
  let tx=OCX+ux*ORX*distFactor,ty=OCY+uy*ORY*distFactor;

  L.flds=FLD_BASE.map(([fx,fy])=>({x:OCX+fx*ORX,y:OCY+fy*ORY}));
  L.chaser=0;
  let bestD=1e9;
  L.flds.forEach((f,idx)=>{
   const d=M.hypot(f.x-tx,f.y-ty);
   if(d<bestD){bestD=d;L.chaser=idx}
  });
  if(o.w&&o.k=='c'){
   tx=L.flds[L.chaser].x+(rnd()-.5)*24;
   ty=L.flds[L.chaser].y+(rnd()-.5)*18;
  }
  L.dest=[tx,ty];
 }

 if(o.w){
  L.big='OUT!';
  L.msg=o.k=='b'?'CLEAN BOWLED! STUMPS FLYING!':'CAUGHT IN THE FIELD!';
  sfx.out();
 }else if(o.r==6){
  L.big='SIX!';L.msg='MASSIVE HIT OVER THE ROPES! ('+(o.timing||'GREAT')+')';sfx.bigHit();sfx.cheer();
 }else if(o.r==4){
  L.big='FOUR!';L.msg='CRACKING SHOT TO THE BOUNDARY! ('+(o.timing||'GOOD')+')';sfx.hit();sfx.cheer();
 }else{
  L.big=o.r?o.r+' RUN'+(o.r>1?'S':''):'';
  L.msg=o.r?o.r+(o.r>1?' runs':' run')+(o.timing?' · '+o.timing:''):'No run'+(o.timing?' · '+o.timing:'');
  if(L.press){if(o.r>0)sfx.hit();else sfx.tap()}
 }
 L.bigT=2.1;
}

function commit(){
 const L=lv,m=L.m,b=m.cur;
 applyBall(m,L.out);
 if(m.done)return endLive();
 if(m.cur!=b)return inningsBreak();
 beginBall();
}
function inningsBreak(){
 const m=lv.m,p=m.inn[m.cur-1];st='brk';root.classList.remove('pl');lv.ci=m.cur;const n=m.inn[m.cur];
 panel(`<h2>INNINGS BREAK</h2><p>${TEAMS[p.bt].c} ${p.r}/${p.w} (${ovs(p.b)})</p>${n.target?`<p>${TEAMS[n.bt].c} need ${n.target} to win</p>`:''}<p>${bats()?'You bat next':'You bowl next'}</p>${B('brk','CONTINUE')}`,'brk');
}
function endLive(){const L=lv;st='brk';onMatch(L.ctx,L.m)}
function simLive(kind){
 const L=lv,m=L.m,c0=m.cur,g=kind=='over'?6-m.inn[m.cur].b%6:kind=='five'?30:1e9;
 for(let i=0;i<g&&!m.done&&m.cur==c0;i++)applyBall(m,simBall(m));
 if(m.done)return endLive();if(m.cur!=c0)return inningsBreak();
 st='play';hideUI();root.classList.add('pl');beginBall();
}
function pause(){
 if(st=='play'){st='pause';panel(`<h2>PAUSED</h2>${B('resume','RESUME')}${B('s1','SIM THIS OVER')}${B('s5','SIM 5 OVERS')}${B('sinn','SIM INNINGS')}${B('menu','QUIT MATCH')}`)}
 else if(st=='pause'){st='play';hideUI()}
}
function quit(){const L=lv;if(!L)return menu();const m={res:{w:L.ctx.b,t:'Match forfeited'},inn:[]};L.ctx.done(m);st='brk';(L.ctx.next||menu)()}

function liveUpd(dt){
 const L=lv;if(!L||st!='play')return;
 L.t+=dt;if(L.bigT>0)L.bigT-=dt;

 // Continuous smooth lateral movement of the batsman across the crease!
 if(bats()&&(L.ph=='stance'||L.ph=='runup'||(L.ph=='flight'&&!L.press))){
  const moveDir=(held.R?1:0)-(held.L?1:0);
  if(moveDir!==0){
   L.batX=cl(L.batX+moveDir*dt*1.05,-.82,.68);
   L.walkPhase+=dt*14;
   L.shotDir=moveDir;
  }
 }else if(!bats()&&L.ph=='spot'){
  const mx=(held.R?1:0)-(held.L?1:0),my=(held.D?1:0)-(held.U?1:0);
  if(mx||my){
   L.bx=cl(L.bx+mx*dt*.95,-.85,.85);
   L.by=cl(L.by+my*dt*.75,.16,.92);
  }
 }
 // AI batsman subtle footwork when user is bowling
 if(!bats()&&L.ph=='flight'){
  L.batX=lerp(L.batX,cl(L.endX-.14,-.7,.55),dt*2.4);
 }

 if(L.ph=='stance'){
  if(L.t>L.tapTick){L.tapTick+=.55;sfx.tap()}
  if(L.t>=1.35)startBowlRunup();
 }else if(L.ph=='runup'){
  if(L.t>L.stepTick){L.stepTick+=.18;sfx.step()}
  if(L.t>=1.35)release();
 }else if(L.ph=='aim'){
  L.meter=(M.sin(L.t*3.1)+1)/2;
 }else if(L.ph=='flight'){
  const p=L.t/L.dur;
  const pb=.18+L.by*.64;
  if(!L.bounced&&p>=pb){L.bounced=true;sfx.bounce()}
  if(L.t>=L.dur+.22)resolve();
 }else if(L.ph=='pitch_res'||L.ph=='outfield'){
  if(L.ph=='outfield'&&L.flds){
   const ch=L.flds[L.chaser],tx=L.dest[0],ty=L.dest[1];
   const dx=tx-ch.x,dy=ty-ch.y,d=M.hypot(dx,dy);
   if(d>5){ch.x+=dx/d*dt*135;ch.y+=dy/d*dt*135}
  }
  if(L.t>=L.resDur)commit();
 }
}

function nav(dx,dy){
 const bs=[...ui.querySelectorAll('.b')];if(!bs.length)return;
 const cur=document.activeElement;if(!bs.includes(cur)){bs[0].focus();return}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=1e9;
 for(const b of bs){
  if(b===cur)continue;
  const p=b.getBoundingClientRect(),x=p.left+p.width/2-cx,y=p.top+p.height/2-cy,pr=x*dx+y*dy;
  if(pr<=2)continue;
  const s=pr+(M.abs(x*dy)+M.abs(y*dx))*2;if(s<bd){bd=s;best=b}
 }
 if(best)best.focus();
}
function back(){if(st=='play'||st=='pause')pause();else if(st=='menu'&&!ui.querySelector('[data-a=single]'))menu()}
function clickFocus(){const a=document.activeElement,b=a&&a.classList&&a.classList.contains('b')?a:ui.querySelector('.b');if(b)b.click()}
const DIRS={ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R'},BACKS=[10009,461,8,27,166];

addEventListener('keydown',e=>{
 au();
 if(!ld.hidden){if(e.code=='Enter'){const b=ld.querySelector('button');if(b)b.click()}return}
 if(BACKS.includes(e.keyCode)||e.code=='Escape'||e.code=='BrowserBack'||e.code=='GoBack'){e.preventDefault();back();return}
 if(e.code=='KeyP'||e.code=='MediaPlayPause'){pause();return}

const PY_TOP=142, PY_BOT=528;
const PW_TOP=134, PW_BOT=334;
const CREASE_TOP=178, CREASE_BOT=460;
const STUMP_TOP_Y=162, STUMP_BOT_Y=474;

function pitchProj(u,v){
 const vp=M.pow(cl(v,-0.25,1.25),1.16);
 const y=CREASE_TOP+(CREASE_BOT-CREASE_TOP)*vp;
 const halfW=(PW_TOP+(PW_BOT-PW_TOP)*vp)*0.5;
 const x=W/2+u*halfW;
 const sc=0.45+0.55*vp;
 return[x,y,sc];
}

// Realistic Articulated Bowler (Run-up stride, Gather Jump, Over-arm Whip & Follow-through)
function drawBowler(L,bw){
 let x=W/2+18,y=84,sc=0.82,stride=0,jumpZ=0,lean=0,bowlArmAng=0.4,leadArmAng=-0.5,hasBall=true;
 if(L){
  if(L.ph=='stance'||L.ph=='spot'||L.ph=='aim'){
   y=78;sc=0.76;
   stride=M.sin(L.t*3)*.15;
   bowlArmAng=0.5;leadArmAng=0.3;
  }else if(L.ph=='runup'){
   const p=cl(L.t/1.35,0,1);
   y=78+p*(CREASE_TOP-86);
   sc=0.76+p*0.18;
   stride=M.sin(L.t*20);
   // Gather & jump right before crease (p in 0.78..0.96)
   if(p>.75){
    const jp=(p-.75)/.25;
    jumpZ=M.sin(jp*M.PI)*14;
    lean=jp*.25;
    // Coil bowling arm behind back, raise front lead arm high toward sky
    bowlArmAng=-M.PI*.65+jp*M.PI*.85;
    leadArmAng=-M.PI*.85+jp*M.PI*.5;
   }else{
    bowlArmAng=stride*.75;
    leadArmAng=-stride*.75;
   }
  }else if(L.ph=='flight'||L.ph=='pitch_res'){
   hasBall=false;
   const ft=cl(L.t*1.8,0,1);
   x=W/2+18+ft*14; // Follow-through veers slightly off pitch
   y=CREASE_TOP-8+ft*22;
   sc=0.95;
   stride=M.sin(ft*M.PI*2)*.6;
   lean=0.32*(1-ft*.5);
   // Full over-the-shoulder whip down across body
   bowlArmAng=M.PI*.15+cl(L.t*5,0,1)*M.PI*.72;
   leadArmAng=0.65;
  }
 }

 X.save();
 X.translate(x,y);
 X.scale(sc,sc);

 // Ground shadow (stays on ground during jump)
 X.fillStyle='rgba(0,0,0,0.34)';
 X.beginPath();X.ellipse(0,30,14-jumpZ*.2,5,0,0,7);X.fill();

 X.translate(0,-jumpZ);
 X.rotate(lean);

 // Articulated Legs (Thigh + Shin + Shoe)
 const lHipX=-5,rHipX=5,hipY=6;
 const lKneeY=17+stride*5,lFootY=28+stride*7;
 const rKneeY=17-stride*5,rFootY=28-stride*7;
 limb(lHipX,hipY,lHipX-1,lKneeY,6.5,bw.pants);
 limb(lHipX-1,lKneeY,lHipX-1,lFootY,5.5,bw.pants);
 limb(rHipX,hipY,rHipX+1,rKneeY,6.5,bw.pants);
 limb(rHipX+1,rKneeY,rHipX+1,rFootY,5.5,bw.pants);
 // White cricket shoes
 X.fillStyle='#f5f5f5';
 X.fillRect(lHipX-4,lFootY-2,7,5);
 X.fillRect(rHipX-3,rFootY-2,7,5);

 // Sculpted Torso (Jersey + V-design)
 X.fillStyle=bw.col;
 X.beginPath();
 X.moveTo(-12,-15);X.lineTo(12,-15);X.lineTo(9,8);X.lineTo(-9,8);
 X.closePath();X.fill();
 X.strokeStyle='#111';X.lineWidth=1.5;X.stroke();
 X.fillStyle=bw.acc;
 X.beginPath();X.moveTo(-11,-12);X.lineTo(11,-12);X.lineTo(0,-2);X.closePath();X.fill();

 // Lead (Left) Arm
 X.save();X.translate(-11,-12);X.rotate(leadArmAng);
 limb(0,0,-2,14,5,bw.col);
 limb(-2,14,0,23,4,'#e0ac69');
 X.restore();

 // Bowling (Right) Arm
 X.save();X.translate(11,-12);X.rotate(bowlArmAng);
 limb(0,0,2,13,5,bw.col);
 limb(2,13,2,24,4.2,'#e0ac69');
 if(hasBall){
  X.fillStyle='#d50000';X.beginPath();X.arc(2,26,4,0,7);X.fill();
  X.strokeStyle='#fff';X.lineWidth=1;X.stroke();
 }
 X.restore();

 // Neck, Head & Hair
 X.fillStyle='#d49b58';X.fillRect(-3,-19,6,5);
 X.fillStyle='#e0ac69';X.beginPath();X.arc(0,-23,7.5,0,7);X.fill();
 X.fillStyle='#181818';X.beginPath();X.arc(0,-25,7.8,M.PI*.95,M.PI*2.05);X.fill();

 X.restore();
}

// Realistic Articulated Batsman (Crease Walking, Bat Tapping, High Backlift & Biomechanical Follow-Through!)
function drawBatsman(L,bt){
 const u=L?L.batX:-.18;
 const[bx,by0]=pitchProj(u,0.98);
 const by=by0-4;

 // Animation state parameters
 let walkSin=0,tapOffset=0,backlift=0,swingProg=0,shotDir=0,isLoft=true,strideX=0,strideY=0,torsoTwist=0;

 if(L){
  const moving=(held.L||held.R)&&(L.ph=='stance'||L.ph=='runup'||(L.ph=='flight'&&!L.press));
  if(moving)walkSin=M.sin(L.walkPhase)*6;

  if(L.ph=='stance'){
   // Realistic bat tapping on the crease!
   tapOffset=M.max(0,M.sin(L.t*11))*10;
  }else if(L.ph=='runup'){
   // Raise bat into ready backlift as bowler approaches crease
   const p=cl((L.t-.4)/.95,0,1);
   backlift=p*0.85;
  }else if(L.ph=='flight'&&!L.press){
   // Cocked high backlift ready to unleash
   backlift=0.95+M.sin(L.t*8)*.06;
  }

  const activeSwing=(L.ph=='flight'&&L.press)||(L.ph=='pitch_res'&&L.press);
  if(activeSwing){
   const dt=L.ph=='flight'?(L.t-L.press.rawT):(L.t+.18);
   swingProg=cl(dt*5.8,0,1); // Smooth, readable swing & follow-through
   shotDir=L.press.dir;
   isLoft=L.press.loft;
   // Footwork stride toward the ball
   strideX=shotDir<0?-10:shotDir>0?18:10;
   strideY=L.by<.38?4:-8; // Back foot on short ball, front foot on full ball
   torsoTwist=swingProg*(shotDir<0?-0.22:0.18);
  }
 }

 X.save();
 X.translate(bx,by);

 // Ground shadow under batsman
 X.fillStyle='rgba(0,0,0,0.4)';
 X.beginPath();X.ellipse(6+strideX*.4,12,28,9,0,0,7);X.fill();

 // Helper to draw a sculpted batting leg + 3-roll protective pad + shoe
 function drawPaddedLeg(hipX,hipY,kneeX,kneeY,ankleX,ankleY,isFront){
  // Thigh
  limb(hipX,hipY,kneeX,kneeY,11,bt.pants,'#111');
  // Lower leg / Shin
  limb(kneeX,kneeY,ankleX,ankleY,11,'#f5f5f5','#222');
  // Sculpted Batting Pad (Knee roll + 3 vertical cane bars + team accent)
  X.save();
  const ang=M.atan2(ankleY-kneeY,ankleX-kneeX)-M.PI/2;
  X.translate(kneeX,kneeY);X.rotate(ang);
  X.fillStyle=isFront?'#ffffff':'#e8eef2';
  X.fillRect(-6,-6,13,28);
  X.strokeStyle='#78909c';X.lineWidth=1.2;X.strokeRect(-6,-6,13,28);
  // Knee roll horizontal lines
  X.beginPath();X.moveTo(-6,1);X.lineTo(7,1);X.moveTo(-6,6);X.lineTo(7,6);X.stroke();
  // Team color pad flash
  X.fillStyle=bt.acc;X.fillRect(-4,-4,9,4);
  X.restore();
  // Spiked Cricket Shoe
  X.fillStyle='#ffffff';
  X.beginPath();X.ellipse(ankleX+4,ankleY+2,9,4.5,0,0,7);X.fill();
  X.strokeStyle='#111';X.lineWidth=1.5;X.stroke();
  X.fillStyle=bt.col;X.fillRect(ankleX,ankleY,7,3);
 }

 // Back Leg (Left Leg)
 const bHipX=-8,bHipY=-24;
 const bKneeX=-11-walkSin*.4,bKneeY=-7+walkSin*.3;
 const bAnkX=-12-walkSin*.8,bAnkY=9;
 drawPaddedLeg(bHipX,bHipY,bKneeX,bKneeY,bAnkX,bAnkY,false);

 // Front Leg (Right Leg - steps into the shot!)
 const fHipX=5,fHipY=-24;
 const fKneeX=10+strideX*.65+walkSin*.4,fKneeY=-7+strideY*.4-walkSin*.3;
 const fAnkX=9+strideX+walkSin*.8,fAnkY=9+strideY*.6;
 drawPaddedLeg(fHipX,fHipY,fKneeX,fKneeY,fAnkX,fAnkY,true);

 // Torso & Shoulders (rotates slightly during shot follow-through)
 X.save();
 X.translate(strideX*.35,-24+strideY*.2);
 X.rotate(torsoTwist);

 // Jersey Torso
 X.fillStyle=bt.col;
 X.beginPath();
 X.moveTo(-13,-28);X.lineTo(13,-27);X.lineTo(12,2);X.lineTo(-12,2);
 X.closePath();X.fill();
 X.strokeStyle='#111';X.lineWidth=1.8;X.stroke();

 // Jersey Chest Stripe & Collar
 X.fillStyle=bt.acc;
 X.fillRect(-12,-16,24,6);
 X.fillStyle='#fff';
 X.beginPath();X.moveTo(-4,-28);X.lineTo(5,-28);X.lineTo(2,-21);X.closePath();X.fill();

 // Neck & Head with Pro Cricket Helmet + Face Grill
 X.save();
 X.translate(3,-35);
 // Neck
 X.fillStyle='#d49b58';X.fillRect(-4,1,7,6);
 // Face
 X.fillStyle='#e0ac69';X.beginPath();X.arc(1,-3,8.5,0,7);X.fill();
 // Helmet Shell (Team color)
 X.fillStyle=bt.pants;
 X.beginPath();X.arc(0,-5,10,M.PI*.78,M.PI*2.18);X.fill();
 X.strokeStyle='#111';X.lineWidth=1.5;X.stroke();
 // Helmet Visor Peak facing bowler
 X.fillStyle=bt.acc;X.fillRect(2,-8,13,3.5);
 // Protective Ear Guard & Steel Grill
 X.fillStyle=bt.pants;X.beginPath();X.arc(1,-2,4,0,7);X.fill();
 X.strokeStyle='#cfd8dc';X.lineWidth=1.3;
 X.beginPath();X.moveTo(4,-2);X.lineTo(11,-1);X.lineTo(10,3);X.lineTo(3,3);X.stroke();
 X.restore();

 // ---- ARTICULATED ARMS, GLOVES & WILLOW CRICKET BAT ----
 const shX=8,shY=-22;
 X.save();
 X.translate(shX,shY);

 // Compute biomechanical arm + bat angle across phases:
 // 0.25 = resting down at crease; -1.25 = cocked high backlift; swing arcs through ball to follow-through!
 let armAng=0.22-tapOffset*.025-backlift*1.38;
 let wristCock=0.12-backlift*.45;

 if(swingProg>0){
  // Smooth ease-out curve for explosive bat speed through impact
  const sp=1-M.pow(1-swingProg,2.4);
  if(shotDir<0){
   // Pull / Hook / Leg-side Whip (swings across body to the left!)
   armAng=lerp(-1.15,-2.65,sp);
   wristCock=lerp(-0.3,-0.85,sp);
  }else if(shotDir>0){
   // Classic Cover Drive / Square Cut (high elbow extension to the off-side!)
   armAng=lerp(-1.15,isLoft?-2.35:1.25,sp);
   wristCock=lerp(-0.3,isLoft?-0.6:0.35,sp);
  }else{
   // Straight Lofted Six / On-Drive (full vertical arc over the shoulder!)
   armAng=lerp(-1.2,isLoft?-2.85:-2.1,sp);
   wristCock=lerp(-0.35,-0.75,sp);
  }
 }

 X.rotate(armAng);

 // Upper Arm & Forearm (Both arms gripping handle)
 limb(-3,0,2,13,6.5,bt.col,'#111');
 limb(2,13,4,24,5.5,'#f5f5f5','#222'); // Forearm arm-guard

 // Padded Batting Gloves
 X.fillStyle='#ffffff';
 X.beginPath();X.arc(4,26,5.5,0,7);X.fill();
 X.strokeStyle='#111';X.lineWidth=1.2;X.stroke();
 X.fillStyle=bt.acc;X.fillRect(0,24,8,3);

 // Bat Handle & 3D Willow Blade
 X.save();
 X.translate(4,26);
 X.rotate(wristCock);
 // Rubber Grip Handle
 X.fillStyle='#eceff1';X.fillRect(-2,0,4.5,14);
 X.fillStyle='#263238';X.fillRect(-2,0,4.5,5);
 X.strokeStyle='#111';X.lineWidth=1;X.strokeRect(-2,0,4.5,14);

 // Willow Blade with sweet-spot ridge & sticker
 X.fillStyle='#d7a15c';
 X.beginPath();
 X.moveTo(-5,14);X.lineTo(7,14);X.lineTo(8,50);X.lineTo(1,52);X.lineTo(-5,50);
 X.closePath();X.fill();
 // Bright wood highlight on blade face
 X.fillStyle='#f5d6a7';X.fillRect(-3,15,4,34);
 // Brand sticker accent on bat
 X.fillStyle=bt.acc;X.fillRect(-4,18,10,7);
 X.strokeStyle='#3e2723';X.lineWidth=1.6;
 X.beginPath();
 X.moveTo(-5,14);X.lineTo(7,14);X.lineTo(8,50);X.lineTo(1,52);X.lineTo(-5,50);
 X.closePath();X.stroke();

 // Motion blur arc during power swing
 if(swingProg>.15&&swingProg<.78){
  X.fillStyle=isLoft?'rgba(255,235,59,0.28)':'rgba(255,255,255,0.22)';
  X.beginPath();X.ellipse(-10,34,14,22,.2,0,7);X.fill();
 }
 X.restore(); // end bat

 X.restore(); // end shoulder
 X.restore(); // end torso
 X.restore(); // end batsman
}

// Compute 3D Ball Position during Flight on Pitch View
function calcBallPitch(L){
 const p=cl(L.t/L.dur,0,1.15);
 const pb=.18+L.by*.64;
 let u,v,z;
 if(p<=pb){
  const k=p/pb;
  u=0.06+(L.bx-0.06)*k;
  v=L.by*k;
  z=44*(1-k*k);
 }else{
  const k=(p-pb)/(1-pb);
  u=L.bx+(L.endX-L.bx)*k;
  v=L.by+(1.0-L.by)*k;
  const maxBounce=L.by<.32?46:L.by>.82?11:27;
  z=M.max(0,maxBounce*M.sin(M.PI*cl(k,0,1.1)*.88));
 }
 const[sx,sy,sc]=pitchProj(u,v);
 const r=4.8+sc*7.2;
 return{sx,sy:sy-z*sc,groundY:sy,r,sc,p,pb};
}

function txt(s,x,y,sz,al='left',c='#fff',stroke=true){
 X.font=`bold ${sz}px "Courier New",Consolas,monospace`;
 X.textAlign=al;
 if(stroke){X.strokeStyle='#000';X.lineWidth=M.max(2.2,sz*.14);X.strokeText(s,x,y)}
 X.fillStyle=c;X.fillText(s,x,y);
}

 const mm=String((elap/60|0)%100).padStart(2,'0'),ss=String(elap%60).padStart(2,'0');

 X.fillStyle='#ffcdd2';X.beginPath();X.arc(bx+19,by+53,3,0,7);X.fill();
 txt(`${n.r}/${n.w}`,bx+bwBox-14,by+65,32,'right','#ffffff');

 // Red horizontal separator bar
 X.fillStyle='#d32f2f';
 X.fillRect(bx+6,by+74,bwBox-12,5);

 // Overs & Batting Team Code
 txt(ovs(n.b),bx+bwBox-14,by+105,30,'right','#ffffff');
 txt(bt.c,bx+14,by+104,22,'left','#76ff03');

 // Top-Right Match Details Panel
 const rx=W-14;
 X.fillStyle='rgba(6,24,10,0.85)';
 X.fillRect(W-316,12,302,94);
 X.strokeStyle='#43a047';X.lineWidth=1.5;X.strokeRect(W-316,12,302,94);

 const nm=i=>pn(n.bt,i),b=n.bat,sb=b[n.st],nb=b[n.ns];
 txt(`*${nm(n.st)} ${sb.r}(${sb.b})`,rx-10,34,17,'right','#ffd54f');
 txt(`${nm(n.ns)} ${nb.r}(${nb.b})`,rx-10,55,16,'right','#cfe8d4');
 let tgtTxt=`${FMT[m.fmt]} · ${bt.c} vs ${bw.c}`;
 if(n.target)tgtTxt=m.maxB?`NEED ${M.max(0,n.target-n.r)} OFF ${m.maxB-n.b}B`:`TARGET ${n.target}`;
 txt(tgtTxt,rx-10,76,16,'right','#76ff03');
 txt(`BWL: ${pn(n.bw,6+((n.b/6|0)%5))}`,rx-10,96,15,'right','#9fd6ac');

 // This Over balls
 n.ov.forEach((v,i)=>{
  const cx=W-304+i*32,cy=124;

  X.beginPath();X.arc(cx,cy,12,0,7);X.fill();
  X.strokeStyle='#fff';X.lineWidth=1.5;X.stroke();
  txt(String(v),cx,cy+5,14,'center',v==4||v==6?'#000':'#fff',false);
 });

 // Bottom Status & Shot Mode Bar
 const bt0=bats();
 X.fillStyle='rgba(4,16,6,0.86)';
 X.fillRect(0,H-38,W,38);
 let hint='';
 if(bt0){
  if(L.ph=='stance'||L.ph=='runup'||L.ph=='flight')hint='HOLD ◀ / ▶ TO MOVE BATSMAN  |  ▲ LOFT (6s)  ▼ GROUND (4s)  |  PRESS HIT!';
  else hint=L.msg;
 }else{
  if(L.ph=='spot')hint='MOVE RED [X] WITH ◀ ▲ ▼ ▶ THEN PRESS BOWL';
  else if(L.ph=='aim')hint='PRESS BOWL WHEN METER IS IN THE GREEN ZONE!';
  else hint=L.msg;
 }
 txt(hint,W/2,H-12,16,'center','#ffffff');

 if(bt0){

function drawOutfieldView(L,bt,bw){
 X.drawImage(OUT_BG,0,0);
 const OCX=480,OCY=285;
 const p=cl(L.t/1.55,0,1);

 // Draw 9 Articulated Fielders
 if(L.flds){
  L.flds.forEach((f,i)=>{
   const isChaser=i===L.chaser&&p<1;
   const runCycle=isChaser?M.sin(L.t*22)*4:0;
   X.fillStyle='rgba(0,0,0,0.35)';X.beginPath();X.ellipse(f.x,f.y+10,7,3.5,0,0,7);X.fill();
   limb(f.x-2,f.y+2,f.x-3+runCycle,f.y+10,3,bw.pants,'');
   limb(f.x+2,f.y+2,f.x+3-runCycle,f.y+10,3,bw.pants,'');
   X.fillStyle=bw.col;X.fillRect(f.x-5,f.y-7,10,11);
   X.fillStyle=bw.acc;X.fillRect(f.x-5,f.y-3,10,3);
   X.fillStyle='#e0ac69';X.beginPath();X.arc(f.x,f.y-10,4.5,0,7);X.fill();
  });
 }

 // Draw Batsmen running between the wickets
 const runs=L.out.w?0:L.out.r==4||L.out.r==6?1:L.out.r;
 const runProg=runs?cl(L.t*1.3,0,runs)%2:0;
 const b1y=OCY+32-(runProg<=1?runProg:2-runProg)*64;
 const b2y=OCY-32+(runProg<=1?runProg:2-runProg)*64;
 for(const ry of[b1y,b2y]){
  X.fillStyle=bt.col;X.fillRect(OCX-5,ry-6,8,11);
  X.fillStyle='#fff';X.beginPath();X.arc(OCX-1,ry-9,3.5,0,7);X.fill();
 }

 // Ball trajectory in outfield
 const bx=OCX+(L.dest[0]-OCX)*p;
 const by0=OCY+30+(L.dest[1]-(OCY+30))*p;
 const maxH=L.out.r==6?135:L.out.w?70:L.out.r==4?28:16;
 const bh=M.max(0,M.sin(M.PI*p)*maxH);

 // Ball shadow
 X.fillStyle='rgba(0,0,0,0.42)';
 X.beginPath();X.ellipse(bx,by0+4,5+bh*.04,3+bh*.02,0,0,7);X.fill();

 // Ball
 const br=5.5+bh*.045;
 X.fillStyle='#ff1744';X.beginPath();X.arc(bx,by0-bh,br,0,7);X.fill();
 X.strokeStyle='#fff';X.lineWidth=1.2;X.stroke();

 // Throw back to wicketkeeper for non-boundary runs
 if(L.t>1.65&&L.out.r<4&&!L.out.w&&L.flds){
  const tp=cl((L.t-1.65)/.7,0,1);
  const ch=L.flds[L.chaser];
  const tx=ch.x+(OCX-ch.x)*tp,ty=ch.y+(OCY+34-ch.y)*tp-M.sin(M.PI*tp)*26;
  X.fillStyle='#ff1744';X.beginPath();X.arc(tx,ty,5,0,7);X.fill();
 }
}

function draw(){
 const L=lv,m=L&&L.m,n=m&&m.inn[m.cur];
 const bt=n?TEAMS[n.bt]:TEAMS[S.team],bw=n?TEAMS[n.bw]:TEAMS[(S.team+1)%TEAMS.length];

 if(L&&L.ph=='outfield'){
  drawOutfieldView(L,bt,bw);
 }else{
  // ---- PERSPECTIVE PITCH VIEW ----
  X.drawImage(PITCH_BG,0,0);

  // 1. Umpire & Non-Striker at Top
  drawUmpireAndNonStriker(L,bt);

  // 2. Top Stumps
  drawStumpsTop();

  // 3. Articulated Bowler
  drawBowler(L,bw);

  // 4. Red 'X' Bounce Marker on Pitch
  if(L){
   const[xx,xy,xsc]=pitchProj(L.bx,L.by);
   const pulse=L.ph=='spot'?1+.14*M.sin(L.t*9):1;
   drawRedX(xx,xy,xsc,pulse);
   if(L.ph=='spot'){
    X.strokeStyle='#ffeb3b';X.lineWidth=2;
    X.beginPath();X.ellipse(xx,xy,24*xsc,14*xsc,0,0,7);X.stroke();
   }
  }else{
   const[xx,xy,xsc]=pitchProj(0,.52);
   drawRedX(xx,xy,xsc,1);
  }

  // 5. Batting Sweet-Spot & Arrival Ring near Crease
  if(L&&bats()&&(L.ph=='stance'||L.ph=='runup'||L.ph=='flight')){
   // Ball target zone at crease
   const[tx,ty]=pitchProj(L.endX,0.98);
   const rem=L.ph=='flight'?M.abs(L.dur-L.t):.7;
   const inZone=L.ph=='flight'&&rem<.24;
   X.strokeStyle=inZone?'#76ff03':'rgba(255,255,255,0.45)';
   X.lineWidth=inZone?4:2;
   X.beginPath();X.ellipse(tx,ty,28,13,0,0,7);X.stroke();

   // Shrinking timing ring during ball flight
   if(L.ph=='flight'){
    const ringR=cl(rem*82,12,78);
    X.strokeStyle=inZone?'#ffeb3b':'rgba(255,235,59,0.55)';
    X.lineWidth=2.2;
    X.beginPath();X.ellipse(tx,ty,ringR,ringR*.48,0,0,7);X.stroke();
   }

   // Batsman's own sweet-spot reach indicator (moves left/right with batsman!)
   const[rx,ry]=pitchProj(L.batX+0.12,0.98);
   X.fillStyle='rgba(118,255,3,0.22)';
   X.beginPath();X.ellipse(rx,ry,24,10,0,0,7);X.fill();
   X.strokeStyle='#76ff03';X.lineWidth=1.5;X.stroke();
  }

  // 6. Ball in Flight on Pitch
  if(L&&L.ph=='flight'){
   const B=calcBallPitch(L);
   X.fillStyle='rgba(0,0,0,0.4)';
   X.beginPath();X.ellipse(B.sx,B.groundY,B.r*.95,B.r*.48,0,0,7);X.fill();
   X.fillStyle='#d50000';
   X.beginPath();X.arc(B.sx,B.sy,B.r,0,7);X.fill();
   X.fillStyle='#ff8a80';
   X.beginPath();X.arc(B.sx-B.r*.3,B.sy-B.r*.3,B.r*.28,0,7);X.fill();
   X.strokeStyle='#ffffff';X.lineWidth=1.5;
   X.beginPath();X.arc(B.sx,B.sy,B.r*.75,-.6,.9);X.stroke();
  }

  // 7. Articulated Batsman (movable across crease!)
  drawBatsman(L,bt);

  // 8. Foreground Bottom Stumps
  const isBowled=L&&L.ph=='pitch_res'&&L.out&&L.out.w&&L.out.k=='b';
  drawStumpsBot(isBowled,L?L.t:0);

  if(L&&L.ph=='pitch_res'&&!isBowled){
   const[bx,by]=pitchProj(L.endX,1.02+M.min(.25,L.t*.12));
   X.fillStyle='#d50000';X.beginPath();X.arc(bx,by-6,9.5,0,7);X.fill();
  }

  // 9. Bowling Accuracy Meter
  if(L&&L.ph=='aim'){
   const mx=W/2-170,my=H-78;
   X.fillStyle='#041006ee';X.fillRect(mx-6,my-8,352,34);
   X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(mx-6,my-8,352,34);
   const g=X.createLinearGradient(mx,0,mx+340,0);
   g.addColorStop(0,'#d32f2f');g.addColorStop(.36,'#fbc02d');g.addColorStop(.5,'#00e676');g.addColorStop(.64,'#fbc02d');g.addColorStop(1,'#d32f2f');
   X.fillStyle=g;X.fillRect(mx,my,340,18);
   X.fillStyle='#ffffff';X.fillRect(mx+L.meter*340-4,my-6,8,30);
  }
 }

 // Match HUD & Big Popups
 if(L){
  drawMatchHUD(L,m,n,bt,bw);
  if(L.bigT>0&&L.big){
   X.save();
   const s=1+M.min(.3,(2.1-L.bigT)*.25);
   X.translate(W/2,H/2-20);X.scale(s,s);
   txt(L.big,0,0,74,'center',L.big=='OUT!'?'#ff1744':'#ffeb3b');
   if(L.out&&L.out.timing&&!L.out.w)txt(L.out.timing,0,42,25,'center','#76ff03');
   X.restore();
  }
 }
}

let last=0;
function loop(ts){
 requestAnimationFrame(loop);
 const dt=M.min(.05,(ts-last)/1000||0);last=ts;
 pad();liveUpd(dt);draw();
}
menu();requestAnimationFrame(loop);
})();
