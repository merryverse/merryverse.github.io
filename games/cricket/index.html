function tone(f,d,ty='square',v=.07,sl=0,w=0){
 if(!AC||S.mute)return;
 const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+w;
 o.type=ty;o.frequency.setValueAtTime(f,n);
 if(sl)o.frequency.exponentialRampToValueAtTime(M.max(30,f+sl),n+d);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
 o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);
}
function noise(d,v){

 const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<a.length;i++)a[i]=(rnd()*2-1)*(1-i/a.length);
 const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start();
}

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ovs=b=>(b/6|0)+'.'+b%6,FMT={T20:'T20',ODI:'ONE DAY',TEST:'TEST',M2:'2-OVER CLASH'};

function newMatch(a,b,fmt,first,useFran=false){
 const o=first==a?b:a;
 const maxB={T20:120,ODI:300,TEST:0,M2:12}[fmt]||120;
 const m={
  fmt,a,b,useFran,
  rosters:{[a]:getRoster(a,useFran),[b]:getRoster(b,false)},
  ord:fmt=='TEST'?[first,o,first,o]:[first,o],
  cur:0,inn:[],maxB,done:false,res:null,tb:0,startT:Date.now()
 };
 startInn(m);return m;
}

function defaultBowlers(ros){
 const idx=ros.map((p,i)=>({i,bo:p.bo,r:p.r})).sort((x,y)=>y.bo-x.bo);
 return idx.slice(0,5).map(x=>x.i);
}

function startInn(m){
 const bt=m.ord[m.cur],bw=bt==m.a?m.b:m.a;
 let target=null;
 if(m.fmt!='TEST'&&m.cur==1)target=m.inn[0].r+1;
 if(m.fmt=='TEST'&&m.cur==3)target=m.inn[0].r+m.inn[2].r-m.inn[1].r+1;
 const bwRos=m.rosters[bw];
 const bList=defaultBowlers(bwRos);
 m.inn.push({
  bt,bw,r:0,w:0,b:0,target,
  bat:[...Array(11)].map(()=>({r:0,b:0,f4:0,s6:0,o:0,how:'',bwl:''})),
  bowl:[...Array(11)].map(()=>({b:0,r:0,w:0,mdn:0,curR:0})),
  st:0,ns:1,bwlIdx:bList[0],lastBwl:-1,bList,
  ov:[],lastOv:[],fow:[],chosenOpeners:false
 });
}

function applyBall(m,o){
 const n=m.inn[m.cur],s=n.bat[n.st],bwStat=n.bowl[n.bwlIdx];
 const bwName=m.rosters[n.bw][n.bwlIdx].n;
 n.b++;m.tb++;s.b++;n.r+=o.r;s.r+=o.r;
 if(o.r==4)s.f4++;if(o.r==6)s.s6++;
 bwStat.b++;bwStat.r+=o.r;bwStat.curR+=o.r;
 n.ov.push(o.w?'W':o.r);

 let fellWicket=false;
 if(o.w){
  n.w++;s.o=1;
  s.how=o.k=='b'?'b '+bwName:o.k=='wk'?'c WK b '+bwName:o.k=='lbw'?'lbw b '+bwName:'c Fielder b '+bwName;
  bwStat.w++;n.fow.push(n.r+'/'+n.w);
  fellWicket=true;
  if(n.w<10){
   for(let i=0;i<11;i++){
    if(i!==n.st&&i!==n.ns&&!n.bat[i].o&&n.bat[i].b===0){n.st=i;break}
   }
  }
 }else if(o.r%2){
  const t=n.st;n.st=n.ns;n.ns=t;
 }

 let overEnded=false;
 if(n.b%6==0){
  overEnded=true;
  n.lastOv=n.ov.slice();
  if(bwStat.curR===0)bwStat.mdn++;
  bwStat.curR=0;
  const t=n.st;n.st=n.ns;n.ns=t;
  n.lastBwl=n.bwlIdx;
  const nextChoices=n.bList.filter(i=>i!==n.lastBwl);
  n.bwlIdx=nextChoices[(n.b/6|0)%nextChoices.length];
 }

 let end=n.w>=10||(m.maxB&&n.b>=m.maxB)||(n.target&&n.r>=n.target);
 if(m.fmt=='TEST'&&m.tb>=2700&&!end){end=true;m.cap=true}
 if(end)endInn(m);
 return{end,fellWicket,overEnded};
}

function endInn(m){
 const T=m.fmt=='TEST';m.cur++;
 if((!T&&m.cur>=2)||(T&&m.cur>=4)||m.cap)return finish(m);
 if(T&&m.cur==3&&m.inn[0].r+m.inn[2].r<=m.inn[1].r){m.by=1;return finish(m)}
 startInn(m);
}

function finish(m){
 m.done=true;const T=m.fmt=='TEST',c=t=>TEAMS[t].c;let w=-1,t='';
 if(!T){
  const f=m.inn[0],s=m.inn[1];
  if(s.r>=s.target){w=s.bt;t=c(w)+' won by '+(10-s.w)+' wickets'}
  else if(s.r==f.r)t='Match tied';
  else{w=f.bt;t=c(w)+' won by '+(f.r-s.r)+' runs'}
 }else if(m.by){
  w=m.ord[1];t=c(w)+' won by an innings and '+(m.inn[1].r-m.inn[0].r-m.inn[2].r)+' runs';
 }else if(m.cap||m.inn.length<4)t='Match drawn';
 else{
  const f=m.inn[3];
  if(f.r>=f.target){w=f.bt;t=c(w)+' won by '+(10-f.w)+' wickets'}
  else if(f.r==f.target-1)t='Match tied';
  else{w=m.ord[0];t=c(w)+' won by '+(f.target-1-f.r)+' runs'}
 }
 m.res={w,t};
}

function aggr(m){
 const n=m.inn[m.cur],ov=n.b/6,F=m.fmt;let a=1;
 if(F=='T20'||F=='M2')a=ov<6?1.15:ov>=16?1.3:1;else if(F=='ODI')a=ov<10?.9:ov>=40?1.35:1;
 if(n.target&&F!='TEST'){const left=m.maxB-n.b,rr=(n.target-n.r)/M.max(1,left)*6,cr=n.b?n.r/n.b*6:rr;if(rr>cr+2)a*=1.3;else if(rr<cr-1.5)a*=.85}
 return a;
}
function wts(m,adjBat=0,adjBowl=0){
 const n=m.inn[m.cur];
 const batP=m.rosters[n.bt][n.st],bwlP=m.rosters[n.bw][n.bwlIdx];
 const d=((batP?batP.ba:80)+adjBat-((bwlP?bwlP.bo:80)+adjBowl))/40,a=aggr(m);
 const b={T20:[34,30,8,1,11,5,5.0],M2:[28,26,8,1,14,8,5.5],ODI:[38,34,8,1,8,2.5,3.5],TEST:[58,24,4,.5,6,.8,2.2]}[m.fmt]||[34,30,8,1,11,5,5.0];
 return[b[0]*(1-d*.3)/M.sqrt(a),b[1],b[2],b[3],b[4]*(1+d*.9)*a,b[5]*(1+d*1.1)*a,b[6]*(1-d*.8)*(.9*a+.1)];
}
function pickW(w){const t=w.reduce((a,b)=>a+M.max(0,b),0);let r=rnd()*t;for(let i=0;i<w.length;i++){r-=M.max(0,w[i]);if(r<=0)return i}return 0}
const VAL=[0,1,2,3,4,6],outFrom=i=>i==6?{r:0,w:1,k:rnd()<.55?'c':'b'}:{r:VAL[i],w:0};
const simBall=m=>outFrom(pickW(wts(m)));
function simMatch(a,b,fmt){
 const m=newMatch(a,b,fmt,rnd()<.5?a:b);
 let g=0;while(!m.done&&g++<20000){const n=m.inn[m.cur];if(n.b%6==0)n.ov=[];applyBall(m,simBall(m))}
 return m;
}

const BOWL_VARS_FAST=['⚡ IN-SWING','⚡ OUT-SWING','🐢 SLOWER','🔥 YORKER/BOUNCE'];
const BOWL_VARS_SPIN=['🌀 OFF BREAK','🌀 LEG BREAK','🎭 DOOSRA','🚀 ARM BALL'];

function userBowl(m,L){
 const n=m.inn[m.cur];
 const batP=m.rosters[n.bt][n.st]||{ba:80},bwlP=m.rosters[n.bw][n.bwlIdx]||{bo:84,st:'FAST'};
 const skillDiff=(bwlP.bo-batP.ba)/100;
 const acc=L.acc;
 const isYorker=L.by>.82,isBouncer=L.by<.28,isGood=L.by>=.40&&L.by<=.72;
 const inStumps=M.abs(L.endX)<.32,fourthStump=L.endX>=.18&&L.endX<=.48;

 let trickScore=0;
 if(L.bVar!==L.lastBwlVar)trickScore+=0.25;else trickScore-=0.15;
 if(M.hypot(L.bx-L.lastBx,L.by-L.lastBy)>.22)trickScore+=0.20;else trickScore-=0.20;
 if(L.aiExpect.zone==='SHORT'&&(isYorker||isGood))trickScore+=0.30;
 if(L.aiExpect.zone==='FULL'&&(isBouncer||L.bVar===2))trickScore+=0.30;
 if(fourthStump&&L.bVar===1)trickScore+=0.28;
 if(inStumps&&(L.bVar===0||isYorker))trickScore+=0.28;

 L.lastBwlVar=L.bVar;L.lastBx=L.bx;L.lastBy=L.by;

 let w;
 if(acc>=0.82){
  const wktChance=18+M.max(0,trickScore*26)+skillDiff*18;
  w=[52, 18, 4, 0, 3, 1, wktChance];
 }else if(acc>=0.60){
  const wktChance=10+M.max(0,trickScore*16)+skillDiff*12;
  w=[42, 26, 7, 1, 8, 2, wktChance];
 }else if(acc>=0.38){
  w=[28, 30, 9, 1, 16, 6, 5];
 }else{
  w=[12, 20, 8, 1, 34, 22, 2];
 }

 const pick=pickW(w);
 const o=outFrom(pick);

 if(o.w){
  if(inStumps&&(isYorker||L.bVar===0||rnd()<.55)){
   o.k='b';o.timing='CLEAN BOWLED!';
  }else if(fourthStump||isBouncer||rnd()<.45){
   o.k='wk';o.timing='EDGED & TAKEN BY KEEPER!';
  }else{
   o.k='c';o.timing=L.bVar===2?'DECEIVED BY SLOWER BALL!':'CAUGHT IN THE FIELD!';
  }
 }else if(o.r===0){
  if(acc>=0.72&&rnd()<.65){
   o.playAndMiss=true;o.timing='SWING & MISS! BEATEN!';
  }else{
   o.timing='SOLID BLOCK';
  }
 }else if(o.r>=4){
  o.timing=acc<.45?'LOOSE BALL PUNISHED!':'CRACKING SHOT!';
 }
 return o;
}

const TB={
 U2:[0, 2, 4, 1, 34, 58, 1],
 U1:[2, 12, 10, 2, 38, 30, 6],
 U0:[16, 18, 8, 0, 16, 10, 32],
 G2:[1, 10, 12, 3, 66, 7, 1],
 G1:[6, 26, 20, 3, 38, 3, 4],
 G0:[28, 28, 12, 0, 14, 0, 18]
};

function userBat(m,L){
 const n=m.inn[m.cur];
 const batP=m.rosters[n.bt][n.st],bwlP=m.rosters[n.bw][n.bwlIdx];
 const dW=((bwlP?bwlP.bo:80)-(batP?batP.ba:82))/100*.28,p=L.press;

 const ballXAtBat=lerp(L.bx,L.endX,cl((L.batY-L.by)/(1.0-L.by),0,1.2));
 const hittingStumps=M.abs(L.endX)<.28&&L.by>.32;
 const batReachX=L.batX+0.12;
 const distX=M.abs(ballXAtBat-batReachX);

 let depthBonus=0,footNote='';
 if(L.batY<0.94){
  if(L.by>=0.40){depthBonus=0.22;footNote='GREAT FRONT-FOOT STEP!'}
  else{depthBonus=-0.16;footNote='CRAMPED BY BOUNCER!'}
 }else if(L.batY>0.99){
  if(L.by<=0.50){depthBonus=0.22;footNote='SUPERB BACK-FOOT PULL/CUT!'}
  else if(L.by>0.84){depthBonus=-0.16;footNote='DEEP IN CREASE VS YORKER!'}
 }

 if(!p){
  if(hittingStumps&&distX>.25&&rnd()<.48)return{r:0,w:1,k:'b',timing:'BOWLED!'};
  if(hittingStumps&&distX<=.25)return{r:0,w:0,timing:'DEFENDED'};
  return{r:0,w:0,timing:'WELL LEFT'};
 }

 const err=(p.t-L.arrivalT)/.30;
 if(M.abs(err)>1.22||distX>.72){
  if(hittingStumps&&rnd()<.38+dW)return{r:0,w:1,k:'b',timing:distX>.72?'MISSED LINE!':err<0?'TOO EARLY!':'TOO LATE!'};
  return{r:0,w:0,playAndMiss:true,timing:distX>.72?'TOO WIDE!':err<0?'EARLY!':'LATE!'};
 }

 let q=1-M.abs(err)*.65-M.max(0,distX-.22)*.6+depthBonus;
 if(distX<.24)q+=.16;
 q=cl(q,0,1);

 const tier=q>.64?2:q>.34?1:0;
 const mode=L.loft?'U':'G';
 const w=TB[mode+tier].slice();
 w[6]*=M.max(.2,1+dW*1.4);

 const o=outFrom(pickW(w));
 if(o.w)o.k=L.loft?'c':(tier==0&&hittingStumps&&rnd()<.55)?'b':'c';
 o.timing=footNote||(tier==2?'PERFECT TIMING!':tier==1?'SWEET TIMING!':'GOOD CONTACT');
 o.q=q;
 return o;
}

const REW={wc:[100,600],bpl:[50,350],ipl:[60,450]};
const compName=c=>c.type=='wc'?'WORLD CUP':c.type.toUpperCase()+' LEAGUE';
function newComp(type,fmt){
 let pool,me;
 if(type=='wc'){pool=natList();me=S.team}
 else{const lg=type.toUpperCase();pool=LG_TEAMS[lg].slice();me=frIdx(lg)}
 const all=shuf([me,...shuf(pool.filter(i=>i!=me))]);
 const h=M.ceil(all.length/2);
 const groups=[all.slice(0,h),all.slice(h)];
 const fix=[];groups.forEach(g=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)fix.push({a:g[i],b:g[j],w:null})});
 return{kind:'comp',type,fmt,me,groups,fix:shuf(fix),stage:'L',ko:[],champ:-1};
}
function tbl(c,g){
 return g.map(t=>{
  let p=0,w=0,pt=0;
  for(const f of c.fix)if(f.w!=null&&(f.a==t||f.b==t)){p++;if(f.w==t){w++;pt+=2}else if(f.w<0)pt++}
  return{t,p,w,pt};
 }).sort((x,y)=>y.pt-x.pt||y.w-x.w||(TEAMS[y.t].ba+TEAMS[y.t].bo)-(TEAMS[x.t].ba+TEAMS[x.t].bo));
}
function recFix(c,f,m){f.w=m.res.w;f.t=m.res.t;if(f.w<0&&c.stage!='L'){f.w=rnd()<.5?f.a:f.b;f.t+=' (super over: '+TEAMS[f.w].c+')'}}
function compAdv(c){
 for(;;){
  const L=c.stage=='L'?c.fix:c.ko,nx=L.find(f=>f.w==null);
  if(nx){if(nx.a==c.me||nx.b==c.me)return nx;recFix(c,nx,simMatch(nx.a,nx.b,c.fmt));continue}
  if(c.stage=='L'){
   const q=c.groups.map(g=>tbl(c,g).map(r=>r.t));
   c.ko=[{a:q[0][0],b:q[1][1],w:null},{a:q[1][0],b:q[0][1],w:null}];
   c.stage='S';continue;
  }
  if(c.stage=='S'){c.ko=[{a:c.ko[0].w,b:c.ko[1].w,w:null}];c.stage='F';continue}
  if(c.stage=='F'){c.champ=c.ko[0].w;c.stage='D'}
  return null;
 }
}

  len:()=>{fl.n=+v;pickOpp()},
  opp:()=>{const o=v=='r'?natOpp():+v;if(fl.k=='single')matchPrompt({a:S.team,b:o,fmt:fl.fmt,done:()=>{},next:menu});else{S.comp={kind:'series',opp:o,fmt:fl.fmt,n:fl.n,w:[0,0],d:0,played:0,log:[]};save();hub()}},
  cont:()=>hub(),endc:()=>{S.comp=null;save();menu()},menu:()=>{if(st=='pause')return quit();menu()},
  play:()=>toss(cur),
  toss_call:()=>resolveTossCall(v),
  tbat:()=>startLive(cur,cur.a),tbowl:()=>startLive(cur,cur.b),go:()=>startLive(cur,v=='me'?cur.a:cur.b),
  cont2:()=>{(cb||menu)()},
  brk:()=>{showInningsSetupSelection()},
  squad:showSquadScreen,
  market:showMarket,
  fran:showFranchise,
  set_lg:()=>{
   if(!LEAGUES[v])return;
   S.league=v;frView=null;save();push();
   if(frScr==='fran')showFranchise();else showMarket();
  },
  fr_pick:()=>{
   const list=LEAGUES[S.league];
   if(list.includes(v)){S.fr[S.league]=v;S.frb[S.league]=v;frView=v;save();push();keepScroll(showFranchise)}
  },

  fr_save:()=>{
   const inp=$('#fn');

   if(name){S.fr[S.league]=name;save();push();sfx.cash()}
   showFranchise();
  },
  buy_p:()=>{

  }
 }else if(L.ph=='spot'){

function resolveContact(){
 const L=lv,m=L.m;let o;
 L.arrivalT=L.dur*(L.batY/0.98);
 if(bats())o=userBat(m,L);
 else{
  o=userBowl(m,L);
  if(o.r>0||o.playAndMiss||(o.w&&o.k!=='b')){
   const aiDir=L.endX<-.1?-1:L.endX>.15?1:0;
   L.press={t:L.arrivalT,rawT:L.arrivalT,dir:aiDir,loft:o.r==6||(o.w&&o.k=='c')};
  }
 }
 L.out=o;L.t=0;L.revealed=false;L.big='';L.msg='';

 const stayedOnPitch=(o.w&&(o.k=='b'||o.k=='wk'))||(!o.w&&o.r==0);

 if(stayedOnPitch){
  L.ph='pitch_res';
  L.resDur=2.3;
  L.revealTime=0.30;
  if(o.w&&o.k=='wk')sfx.batCrack();
 }else{
  L.ph='outfield';
  L.resDur=3.3;
  L.revealTime=1.55;
  sfx.batCrack();

  const ORX=390,ORY=200,OCX=480,OCY=275;
  L.flds=FLD_ANGLES.map((ang,i)=>({
   ang,rad:FLD_RADII[i],
   x:OCX+M.cos(ang)*ORX*FLD_RADII[i],
   y:OCY-M.sin(ang)*ORY*FLD_RADII[i]
  }));

  const pDir=L.press?L.press.dir:0;
  const legGaps=[2.12, 2.60, 3.22];
  const offGaps=[0.55, 1.03, 5.95];
  const strGaps=[1.57, 1.05, 2.10];

  let chosenAng;
  if(o.w&&o.k=='c'){
   const sectorIndices=pDir<0?[3,4,5,6]:pDir>0?[0,1,2,8]:[1,2,3,4];
   L.chaser=sectorIndices[rnd()*sectorIndices.length|0];
   const cf=L.flds[L.chaser];
   L.dest=[cf.x,cf.y];
   L.pitchVec=[M.cos(cf.ang),-M.sin(cf.ang)];
  }else{
   const gapList=pDir<0?legGaps:pDir>0?offGaps:strGaps;
   chosenAng=gapList[rnd()*gapList.length|0]+(rnd()-.5)*0.08;
   const ux=M.cos(chosenAng),uy=-M.sin(chosenAng);

   const distFactor=o.r==6?1.15:o.r==4?1.04:o.r==3?.76:o.r==2?.62:.46;
   const tx=OCX+ux*ORX*distFactor,ty=OCY+uy*ORY*distFactor;
   L.dest=[tx,ty];
   L.pitchVec=[ux,uy];

   L.chaser=0;let bestD=1e9;
   L.flds.forEach((f,idx)=>{
    const d=M.hypot(f.x-tx,f.y-ty);
    if(d<bestD){bestD=d;L.chaser=idx}
   });
  }
 }
}

function triggerOutcomeReveal(){
 const L=lv,o=L.out;
 if(L.revealed||!o)return;
 L.revealed=true;
 L.bigT=1.75;
 if(o.w){
  L.big='OUT!';
  L.msg=o.timing||(o.k=='b'?'CLEAN BOWLED!':o.k=='wk'?'EDGED & CAUGHT BEHIND!':'CAUGHT OUT!');

 }else if(o.r==6){
  L.big='SIX!';L.msg='HUGE SIX! SAILS OVER THE ROPES! · '+(o.timing||'');sfx.cheer();
 }else if(o.r==4){
  L.big='FOUR!';L.msg='BOUNCES & RACES ACROSS THE ROPE — FOUR! · '+(o.timing||'');sfx.cheer();
 }else{
  L.big=o.r?o.r+' RUN'+(o.r>1?'S':''):'DOT BALL';
  L.msg=o.r?o.r+(o.r>1?' runs':' run')+' · '+(o.timing||''):'No run · '+(o.timing||'');
 }
}

function commit(){
 const L=lv,m=L.m,b=m.cur;
 const res=applyBall(m,L.out);
 if(m.done)return endLive();
 if(m.cur!=b)return inningsBreak();
 const n=m.inn[m.cur];
 if(res.fellWicket&&n.w<10&&n.bt===L.u){
  if(res.overEnded)L.pendingOverEnd=true;
  return showNextBatsmanModal();
 }
 if(res.overEnded){
  return showEndOfOverModal();
 }
 beginBall();
}

}

function liveUpd(dt){
 const L=lv;if(!L||st!='play')return;
 L.t+=dt;if(L.bigT>0)L.bigT-=dt;

 if(bats()&&(L.ph=='stance'||L.ph=='runup'||(L.ph=='flight'&&!L.press))){
  const mx=(held.R?1:0)-(held.L?1:0);
  const my=(held.D?1:0)-(held.U?1:0);
  if(mx!==0){
   L.batX=cl(L.batX+mx*dt*1.02,-.82,.68);
   L.walkPhase+=dt*14;
   L.shotDir=mx;
  }
  if(my!==0){
   L.batY=cl(L.batY+my*dt*0.26,0.84,1.04);
   L.walkPhase+=dt*12;
   if(mx===0&&my<0)L.shotDir=0;
  }
 }else if(!bats()&&L.ph=='spot'){
  const mx=(held.R?1:0)-(held.L?1:0),my=(held.D?1:0)-(held.U?1:0);
  if(mx||my){
   L.bx=cl(L.bx+mx*dt*.95,-.85,.85);
   L.by=cl(L.by+my*dt*.75,.14,.94);
  }
 }
 if(!bats()&&L.ph=='flight'){
  L.batX=lerp(L.batX,cl(L.endX-.14,-.7,.55),dt*2.4);
  L.batY=lerp(L.batY,L.by<.36?1.02:0.95,dt*2.0);
 }

 if(L.ph=='stance'){
  if(L.t>L.tapTick){L.tapTick+=.55;sfx.tap()}
  if(L.t>=1.25)startBowlRunup();
 }else if(L.ph=='runup'){
  if(L.t>L.stepTick){L.stepTick+=.18;sfx.step()}
  if(L.t>=1.28)release();
 }else if(L.ph=='aim'){
  L.meter=(M.sin(L.t*4.2)+1)/2;
 }else if(L.ph=='flight'){
  L.arrivalT=L.dur*(L.batY/0.98);
  const p=L.t/L.dur;
  const pb=.18+L.by*.64;
  if(!L.bounced&&p>=pb){L.bounced=true;sfx.bounce()}
  if(L.t>=L.arrivalT+.18)resolveContact();
 }else if(L.ph=='pitch_res'||L.ph=='outfield'){
  if(!L.revealed&&L.t>=L.revealTime){
   triggerOutcomeReveal();
  }
  if(L.ph=='outfield'&&L.flds&&L.t>.35){
   const ch=L.flds[L.chaser];
   const tx=L.dest[0],ty=L.dest[1];
   const dx=tx-ch.x,dy=ty-ch.y,d=M.hypot(dx,dy);
   const spd=L.out.r==6?65:L.out.r==4?125:160;
   if(d>6&&!(L.out.w&&L.out.k=='c')){ch.x+=dx/d*dt*spd;ch.y+=dy/d*dt*spd}
  }
  if(L.t>=L.resDur)commit();
 }
}

function pitchProj(u,v){
 const vp=M.pow(cl(v,-0.25,1.25),1.15);
 const y=CREASE_TOP+(CREASE_BOT-CREASE_TOP)*vp;
 const halfW=(PW_TOP+(PW_BOT-PW_TOP)*vp)*0.5;
 const x=W/2+u*halfW;
 const sc=0.45+0.55*vp;
 return[x,y,sc];
}

 X.strokeStyle='#111';X.lineWidth=1.6;X.stroke();
 X.fillStyle=bt.acc;X.fillRect(-11,-15,22,5);

 X.fillStyle='#e0ac69';X.beginPath();X.arc(2,-35,8,0,7);X.fill();
 X.fillStyle=bt.pants;X.beginPath();X.arc(1,-37,9.5,M.PI*.8,M.PI*2.2);X.fill();
 X.fillStyle=bt.acc;X.fillRect(3,-39,12,3);

 let hx=10,hy=-6-tapOffset-backlift*7;
 let batAng=lerp(0.28,-0.85,backlift);

 if(swingProg>0){

  if(shotDir<0){
   hx=lerp(10,-16,sp);

 }

 const lElbX=(-9+hx)*0.5-4,lElbY=(-22+hy)*0.5+4;

function calcBallPitch(L){
 const p=cl(L.t/L.dur,0,1.15);
 const pb=.18+L.by*.64;
 let u,v,z;
 if(p<=pb){
  const k=p/pb;u=0.06+(L.bx-0.06)*k;v=L.by*k;z=42*(1-k*k);
 }else{
  const k=(p-pb)/(1-pb);
  const curve=M.pow(cl(k,0,1),1.25);
  u=L.bx+(L.endX-L.bx)*curve;
  v=L.by+(1.0-L.by)*k;
  const maxBounce=L.by<.32?44:L.by>.82?10:26;
  z=M.max(0,maxBounce*M.sin(M.PI*cl(k,0,1.1)*.88));
 }
 const[sx,sy,sc]=pitchProj(u,v);
 const r=4.8+sc*6.8;
 return{sx,sy:sy-z*sc,groundY:sy,r};
}

 const crr=n.b?(n.r/n.b*6).toFixed(2):'0.00';
 let info=`${FMT[m.fmt]} | CRR ${crr}`;
 if(n.target)info+=` | TARGET ${n.target} (need ${M.max(0,n.target-n.r)} off ${m.maxB-n.b}b)`;
 txt(info,10,19,12,'left','#b3f5d6',false,CW-20);

 let l2=`⚡ ${L.spd.toFixed(1)} km/h`;
 if(bats()&&(L.ph=='stance'||L.ph=='runup'||L.ph=='flight')){
  const dirTxt=L.shotDir<0?'◀ LEG':L.shotDir>0?'OFF ▶':'▲ STRAIGHT';
  const footTxt=L.batY<0.94?'FRONT-FOOT':L.batY>0.99?'BACK-FOOT':'NORMAL';
  l2=`${dirTxt} · ${footTxt} · ${L.loft?'🚀 LOFT':'🌱 GROUND'}`;
 }else if(!bats()&&(L.ph=='spot'||L.ph=='aim')){
  const vNames=bwP.st==='FAST'?BOWL_VARS_FAST:BOWL_VARS_SPIN;
  l2=`🧠 ${L.aiExpect.txt} [${vNames[L.bVar%4]}]`;
 }
 txt(l2,10,41,11,'left','#ffd166',false,CW-20);

 let hint='';
 if(L.revealed)hint=L.msg;
 else if(bats())hint='◀/▶ Aim | ▲/▼ Step | Press SHOT';
 else hint=L.ph=='spot'?'Move [X], Pick SWING & Press BOWL':L.ph=='aim'?'Stop Meter in Gold/Green!':'Bowling...';
 txt(hint,CW/2,CH-HB-10,13,'center','#3dffa0',true,CW-16);

 const by=CH-HB;
 const gBar=X.createLinearGradient(0,by,CW,by);
 gBar.addColorStop(0,'#04120c');gBar.addColorStop(0.5,'#082218');gBar.addColorStop(1,'#04120c');
 X.fillStyle=gBar;X.fillRect(0,by,CW,HB);
 X.fillStyle='#1fbf7a';X.fillRect(0,by,CW,3);

 X.fillStyle=bt.col;X.fillRect(0,by+3,150,HB-3);
 txt(bt.c,10,by+32,24,'left','#fff');
 txt(`${n.r}-${n.w}`,10,by+62,26,'left','#ffd166');
 txt(`(${ovs(n.b)}${m.maxB?'/'+m.maxB/6:''})`,10,by+86,12,'left','#e0f7fa',false);

 txt(`▸ ${roleCanvasIcon(stP)} ${stP.n}`,160,by+24,14,'left','#ffd166',false,CW-240);
 txt(`${sb.r} (${sb.b})`,CW-10,by+24,14,'right','#ffd166',false);
 txt(`  ${roleCanvasIcon(nsP)} ${nsP.n}`,160,by+44,13,'left','#b0bec5',false,CW-240);
 txt(`${nb.r} (${nb.b})`,CW-10,by+44,13,'right','#b0bec5',false);
 X.fillStyle='rgba(255,255,255,0.18)';X.fillRect(160,by+52,CW-170,1);
 txt(`${roleCanvasIcon(bwP)} ${bwP.n}`,160,by+68,14,'left','#4fc3f7',false,CW-250);
 txt(`${bwSt.w}-${bwSt.r} (${ovs(bwSt.b)})`,CW-10,by+68,14,'right','#ffffff',false);

 n.ov.slice(-6).forEach((v,i)=>{
  const cx=172+i*26,cy=by+85;
  X.fillStyle=v=='W'?'#e53935':v==4||v==6?'#00c853':'#17493a';
  X.beginPath();X.arc(cx,cy,9,0,7);X.fill();
  txt(String(v),cx,cy+4,11,'center','#fff',false);
 });
}

function drawMeter(L,mx,my){
 X.fillStyle='#04101eee';X.fillRect(mx-6,my-8,352,32);
 const g=X.createLinearGradient(mx,0,mx+340,0);
 g.addColorStop(0,'#d32f2f');g.addColorStop(.36,'#fbc02d');g.addColorStop(.46,'#00e676');g.addColorStop(.5,'#ffd54f');g.addColorStop(.54,'#00e676');g.addColorStop(.64,'#fbc02d');g.addColorStop(1,'#d32f2f');
 X.fillStyle=g;X.fillRect(mx,my,340,16);
 X.fillStyle='#ffffff';X.fillRect(mx+L.meter*340-4,my-6,8,28);
}

function drawOutfieldView(L,bt,bw){
 if(L.t<0.35){
  drawPitchScene(L,bt,bw);
  const p=L.t/0.35;
  const[sx,sy]=pitchProj(L.batX+0.12,L.batY);
  const vx=L.pitchVec[0]*340*p,vy=L.pitchVec[1]*260*p-(L.out.r==6||L.out.w?110*p:20*p);
  X.fillStyle='#ffffff';X.beginPath();X.arc(sx+vx,sy+vy,7,0,7);X.fill();
  return;
 }

 X.drawImage(OUT_BG,0,0);
 const OCX=480,OCY=275;
 const p=cl((L.t-0.35)/(L.revealTime-0.35),0,1);

 if(L.flds){
  L.flds.forEach((f,i)=>{
   const isChaser=i===L.chaser&&p<1&&!(L.out.w&&L.out.k=='c');
   const runCycle=isChaser?M.sin(L.t*22)*4:0;
   X.fillStyle='rgba(0,0,0,0.35)';X.beginPath();X.ellipse(f.x,f.y+10,7,3.5,0,0,7);X.fill();
   limb(f.x-2,f.y+2,f.x-3+runCycle,f.y+10,3,bw.pants,'');
   limb(f.x+2,f.y+2,f.x+3-runCycle,f.y+10,3,bw.pants,'');
   X.fillStyle=bw.col;X.fillRect(f.x-5,f.y-7,10,11);
   X.fillStyle='#e0ac69';X.beginPath();X.arc(f.x,f.y-10,4.5,0,7);X.fill();
  });
 }

 const runs=L.out.w?0:L.out.r==4||L.out.r==6?1:L.out.r;
 const runProg=runs?cl((L.t-0.35)*1.3,0,runs)%2:0;
 const b1y=OCY+32-(runProg<=1?runProg:2-runProg)*64;
 const b2y=OCY-32+(runProg<=1?runProg:2-runProg)*64;
 for(const ry of[b1y,b2y]){
  X.fillStyle=bt.col;X.fillRect(OCX-5,ry-6,8,11);
  X.fillStyle='#fff';X.beginPath();X.arc(OCX-1,ry-9,3.5,0,7);X.fill();
 }

 const bx=OCX+(L.dest[0]-OCX)*p;
 const by0=OCY+28+(L.dest[1]-(OCY+28))*p;

 let bh=0;
 if(L.out.r==6){
  bh=M.sin(M.PI*p)*145;
 }else if(L.out.w&&L.out.k=='c'){
  bh=M.sin(M.PI*p)*82;
 }else if(L.out.r==4){
  if(p<0.48)bh=M.sin(M.PI*(p/0.48))*(L.press&&L.press.loft?34:14);
  else if(p<0.75)bh=M.sin(M.PI*((p-0.48)/0.27))*10;
  else bh=0;
 }else{
  bh=p<0.45?M.sin(M.PI*(p/0.45))*12:0;
 }

 X.fillStyle='rgba(0,0,0,0.45)';
 X.beginPath();X.ellipse(bx,by0+4,5+bh*.03,3+bh*.015,0,0,7);X.fill();

 X.strokeStyle=L.out.r==6?'rgba(255,213,79,0.55)':L.out.r==4?'rgba(0,230,118,0.45)':'rgba(255,255,255,0.35)';
 X.lineWidth=3;
 X.beginPath();X.moveTo(OCX,OCY+28);X.lineTo(bx,by0-bh);X.stroke();

 X.fillStyle='#ffffff';X.beginPath();X.arc(bx,by0-bh,5.5+bh*.04,0,7);X.fill();
 X.strokeStyle='#d50000';X.lineWidth=1.2;X.stroke();
}

function drawPitchScene(L,bt,bw){
 X.drawImage(PITCH_BG,0,0);
 drawUmpireAndNonStriker(L,bt,bw);
 drawStumpsTop();
 drawBowler(L,bw);

 if(L){
  const[xx,xy,xsc]=pitchProj(L.bx,L.by);
  const pulse=L.ph=='spot'?1+.14*M.sin(L.t*9):1;
  drawRedX(xx,xy,xsc,pulse);
  if(!bats()&&L.ph=='spot'){
   const curve=L.bVar===0?-0.34:L.bVar===1?0.34:L.bVar===2?0.18:0.06;
   const predEndX=cl(L.bx+curve*(1-L.by*.35),-0.92,0.92);
   const[ex,ey]=pitchProj(predEndX,0.98);
   X.strokeStyle='rgba(255,235,59,0.75)';X.lineWidth=2.5;X.setLineDash([5,4]);
   X.beginPath();X.moveTo(xx,xy);X.lineTo(ex,ey);X.stroke();X.setLineDash([]);
  }
 }

 if(L&&bats()&&(L.ph=='stance'||L.ph=='runup'||L.ph=='flight')){
  const arrT=L.dur*(L.batY/0.98);
  const ballXAtBat=lerp(L.bx,L.endX,cl((L.batY-L.by)/(1.0-L.by),0,1.2));
  const[tx,ty]=pitchProj(ballXAtBat,L.batY);
  const rem=L.ph=='flight'?M.abs(arrT-L.t):.7;
  const inZone=L.ph=='flight'&&rem<.24;
  X.strokeStyle=inZone?'#00e676':'rgba(255,255,255,0.45)';
  X.lineWidth=inZone?4:2;
  X.beginPath();X.ellipse(tx,ty,28,12,0,0,7);X.stroke();
  if(L.ph=='flight'){
   const ringR=cl(rem*82,12,76);
   X.strokeStyle=inZone?'#ffd54f':'rgba(255,213,79,0.55)';
   X.lineWidth=2;X.beginPath();X.ellipse(tx,ty,ringR,ringR*.46,0,0,7);X.stroke();
  }
  const[rx,ry]=pitchProj(L.batX+0.12,L.batY);
  X.fillStyle='rgba(0,230,118,0.24)';
  X.beginPath();X.ellipse(rx,ry,24,10,0,0,7);X.fill();
 }

 if(L&&L.ph=='flight'){
  const B=calcBallPitch(L);
  X.fillStyle='rgba(0,0,0,0.4)';X.beginPath();X.ellipse(B.sx,B.groundY,B.r*.95,B.r*.48,0,0,7);X.fill();
  X.fillStyle='#ffffff';X.beginPath();X.arc(B.sx,B.sy,B.r,0,7);X.fill();
  X.strokeStyle='#d50000';X.lineWidth=1.5;X.beginPath();X.arc(B.sx,B.sy,B.r*.75,-.6,.9);X.stroke();
 }

 drawBatsman(L,bt);
 const isBowled=L&&L.ph=='pitch_res'&&L.out&&L.out.w&&L.out.k=='b'&&L.t>=0.25;
 drawStumpsBot(isBowled,L?L.t:0);

 if(L&&L.ph=='pitch_res'&&!isBowled){
  const p=cl(L.t/0.4,0,1);
  const[sx,sy]=pitchProj(L.endX,1.0+p*0.18);
  X.fillStyle='#ffffff';X.beginPath();X.arc(sx,sy-12,7.5,0,7);X.fill();
 }

 if(L&&L.ph=='aim'&&!PT)drawMeter(L,W/2-170,H-96);
}

function draw(){
 const L=lv,m=L&&L.m,n=m&&m.inn[m.cur];
 const bt=n?TEAMS[n.bt]:TEAMS[S.team],bw=n?TEAMS[n.bw]:TEAMS[(S.team+1)%NAT];

 X.setTransform(1,0,0,1,0,0);

 if(!PT){
  if(L&&L.ph=='outfield')drawOutfieldView(L,bt,bw);
  else drawPitchScene(L,bt,bw);

  if(L&&m&&n){
   drawBroadcastHUD(L,m,n,bt,bw);
   if(L.revealed&&L.bigT>0&&L.big){
    X.save();
    const s=1+M.min(.28,(1.75-L.bigT)*.25);
    X.translate(W/2,H/2-25);X.scale(s,s);
    txt(L.big,0,0,72,'center',L.big=='OUT!'?'#ff1744':'#ffd54f');
    if(L.out&&L.out.timing)txt(L.out.timing,0,40,22,'center','#00e676');
    X.restore();
   }
  }
  return;
 }

 X.fillStyle='#02070a';X.fillRect(0,0,CW,CH);
 const AH=CH-HT-HB;
 const outView=L&&L.ph=='outfield'&&L.t>=0.35;
 const s=outView?M.min(CW/W,AH/H):M.min(CW/420,AH/H);
 const tx=CW/2-480*s,ty=HT+(AH-H*s)/2;
 X.save();
 X.beginPath();X.rect(0,HT,CW,AH);X.clip();
 X.setTransform(s,0,0,s,tx,ty);
 if(L&&L.ph=='outfield')drawOutfieldView(L,bt,bw);
 else drawPitchScene(L,bt,bw);
 X.restore();
 X.setTransform(1,0,0,1,0,0);

 if(L&&m&&n){
  if(L.ph=='aim')drawMeter(L,CW/2-170,CH-HB-56);
  drawPortraitHUD(L,m,n,bt,bw);
  if(L.revealed&&L.bigT>0&&L.big){
   X.save();
   const k=1+M.min(.28,(1.75-L.bigT)*.25);
   X.translate(CW/2,HT+AH/2-20);X.scale(k,k);
   txt(L.big,0,0,58,'center',L.big=='OUT!'?'#ff1744':'#ffd54f',true,CW-30);
   if(L.out&&L.out.timing)txt(L.out.timing,0,34,20,'center','#3dffa0',true,CW-30);
   X.restore();
  }
 }
}

let last=0;
function loop(ts){
 requestAnimationFrame(loop);
 const dt=M.min(.05,(ts-last)/1000||0);last=ts;
 liveUpd(dt);draw();
}
menu();requestAnimationFrame(loop);
})();
</script></body></html>
