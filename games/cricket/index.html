// ---------- retro Nokia audio ----------
let AC;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function tone(f,d,ty='square',v=.07,sl=0,w=0){
 if(!AC||S.mute)return;
 const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+w;
 o.type=ty;o.frequency.setValueAtTime(f,n);
 if(sl)o.frequency.exponentialRampToValueAtTime(M.max(30,f+sl),n+d);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
 o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d);
}
function noise(d,v){
 if(!AC||S.mute)return;
 const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<a.length;i++)a[i]=(rnd()*2-1)*(1-i/a.length);
 const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start();
}

 tick:()=>tone(720,.035,'square',.05),

};

// ---------- teams ----------
const TEAMS=[
 ['Bangladesh','BAN',78,77,'#006a4e','#f42a41'],
 ['India','IND',88,86,'#1565c0','#ff9800'],
 ['Pakistan','PAK',83,85,'#1b5e20','#cddc39'],
 ['Australia','AUS',87,87,'#f9a825','#1b5e20'],
 ['England','ENG',86,82,'#b71c1c','#1a237e'],
 ['South Africa','RSA',84,86,'#2e7d32','#fbc02d'],
 ['New Zealand','NZL',80,83,'#263238','#00bcd4'],
 ['Sri Lanka','SRI',76,77,'#1e3c8a','#ffc107']
].map(([n,c,ba,bo,col,acc])=>({n,c,ba,bo,col,acc}));

const FN=['Liton','Shakib','Tamim','Taskin','Miraz','Rohit','Virat','Bumrah','Babar','Shaheen','Rizwan','Head','Starc','Smith','Root','Stokes','Buttler','Rabada','Markram','Kane','Boult','Pathum','Hasaranga','Mushfiq'];
const LN=['Das','Hasan','Iqbal','Ahmed','Miraz','Sharma','Kohli','Singh','Azam','Afridi','Khan','Warner','Cummins','Maxwell','Brook','Wood','Archer','Klaasen','Miller','Southee','Santner','Mendis','ekera','Rahim'];
const pn=(t,i)=>FN[(t*5+i*3)%FN.length][0]+'. '+LN[(t*7+i*5+i)%LN.length];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ovs=b=>(b/6|0)+'.'+b%6,FMT={T20:'T20',ODI:'ONE DAY',TEST:'TEST'};

// ---------- match engine ----------
function newMatch(a,b,fmt,first){
 const o=first==a?b:a;
 const m={fmt,a,b,ord:fmt=='TEST'?[first,o,first,o]:[first,o],cur:0,inn:[],maxB:{T20:120,ODI:300,TEST:0}[fmt],done:false,res:null,tb:0,startT:Date.now()};
 startInn(m);return m;
}
function startInn(m){
 const bt=m.ord[m.cur],bw=bt==m.a?m.b:m.a;let target=null;
 if(m.fmt!='TEST'&&m.cur==1)target=m.inn[0].r+1;
 if(m.fmt=='TEST'&&m.cur==3)target=m.inn[0].r+m.inn[2].r-m.inn[1].r+1;
 m.inn.push({bt,bw,r:0,w:0,b:0,target,bat:[...Array(11)].map(()=>({r:0,b:0,o:0,h:''})),st:0,ns:1,nx:2,ov:[],fow:[]});
}
function applyBall(m,o){
 const n=m.inn[m.cur],s=n.bat[n.st];n.b++;m.tb++;s.b++;n.r+=o.r;s.r+=o.r;n.ov.push(o.w?'W':o.r);
 if(o.w){n.w++;s.o=1;s.h=o.k;n.fow.push(n.r);if(n.w<10)n.st=n.nx++}
 else if(o.r%2){const t=n.st;n.st=n.ns;n.ns=t}
 if(n.b%6==0){const t=n.st;n.st=n.ns;n.ns=t;n.ov=[]}
 let end=n.w>=10||(m.maxB&&n.b>=m.maxB)||(n.target&&n.r>=n.target);
 if(m.fmt=='TEST'&&m.tb>=2700&&!end){end=true;m.cap=true}
 if(end)endInn(m);return end;
}
function endInn(m){
 const T=m.fmt=='TEST';m.cur++;
 if((!T&&m.cur>=2)||(T&&m.cur>=4)||m.cap)return finish(m);
 if(T&&m.cur==3&&m.inn[0].r+m.inn[2].r<=m.inn[1].r){m.by=1;return finish(m)}
 startInn(m);
}
function finish(m){
 m.done=true;const T=m.fmt=='TEST',c=t=>TEAMS[t].c;let w=-1,t='';
 if(!T){
  const f=m.inn[0],s=m.inn[1];
  if(s.r>=s.target){w=s.bt;t=c(w)+' won by '+(10-s.w)+' wickets'}
  else if(s.r==f.r)t='Match tied';
  else{w=f.bt;t=c(w)+' won by '+(f.r-s.r)+' runs'}
 }else if(m.by){
  w=m.ord[1];t=c(w)+' won by an innings and '+(m.inn[1].r-m.inn[0].r-m.inn[2].r)+' runs';
 }else if(m.cap||m.inn.length<4)t='Match drawn';
 else{
  const f=m.inn[3];
  if(f.r>=f.target){w=f.bt;t=c(w)+' won by '+(10-f.w)+' wickets'}
  else if(f.r==f.target-1)t='Match tied';
  else{w=m.ord[0];t=c(w)+' won by '+(f.target-1-f.r)+' runs'}
 }
 m.res={w,t};
}
function aggr(m){
 const n=m.inn[m.cur],ov=n.b/6,F=m.fmt;let a=1;
 if(F=='T20')a=ov<6?1.15:ov>=16?1.3:1;else if(F=='ODI')a=ov<10?.9:ov>=40?1.35:1;
 if(n.target&&F!='TEST'){const left=m.maxB-n.b,rr=(n.target-n.r)/M.max(1,left)*6,cr=n.b?n.r/n.b*6:rr;if(rr>cr+2)a*=1.3;else if(rr<cr-1.5)a*=.85}
 if(F=='TEST'&&n.target)a=1.1;return a;
}
function wts(m,adjBat=0,adjBowl=0){
 const n=m.inn[m.cur],d=(TEAMS[n.bt].ba+adjBat-(TEAMS[n.bw].bo+adjBowl))/40,a=aggr(m);
 const b={T20:[34,33,8,1,10,5,4.5],ODI:[38,36,8,1,8,2.5,2.8],TEST:[60,24,3.5,.5,5.5,.5,1.6]}[m.fmt];
 return[b[0]*(1-d*.3)/M.sqrt(a),b[1],b[2],b[3],b[4]*(1+d*.9)*a,b[5]*(1+d*1.1)*a,b[6]*(1-d*.8)*(.9*a+.1)];
}
function pickW(w){const t=w.reduce((a,b)=>a+M.max(0,b),0);let r=rnd()*t;for(let i=0;i<w.length;i++){r-=M.max(0,w[i]);if(r<=0)return i}return 0}
const VAL=[0,1,2,3,4,6],outFrom=i=>i==6?{r:0,w:1,k:rnd()<.55?'c':'b'}:{r:VAL[i],w:0};
const simBall=m=>outFrom(pickW(wts(m)));
function simMatch(a,b,fmt){const m=newMatch(a,b,fmt,rnd()<.5?a:b);let g=0;while(!m.done&&g++<20000)applyBall(m,simBall(m));return m}

// Bowling & Batting outcome calculations
function userBowl(m,bx,by,acc){
 // bx in [-1..1], by in [0..1] (0=short, 0.5=good, 0.9=yorker)
 const goodSpot=(by>.42&&by<.68)||(by>.84);
 const adj=(acc-.45)*55+(goodSpot?8:0);
 const w=wts(m,0,adj);
 if(by>.84){w[6]*=1.35;w[4]*=1.15;if(acc<.45)w[4]*=1.45}
 else if(by<.25){w[5]*=1.25;w[6]*=1.2;if(acc<.45)w[5]*=1.5}
 if(acc<.3){w[4]*=1.5;w[5]*=1.4}
 const o=outFrom(pickW(w));
 if(o.w&&by>.78&&M.abs(bx)<.38)o.k='b';
 return o;
}

const TB={
 G2:[2,12,14,2,62,6,2],
 G1:[10,36,24,2,20,2,6],
 G0:[32,26,10,0,4,0,28],
 U2:[0,2,5,0,28,62,3],
 U1:[4,10,8,0,24,22,32],
 U0:[14,10,4,0,2,0,70],
 D2:[58,35,5,0,1,0,1],
 D1:[52,36,6,0,2,0,4],
 D0:[48,25,2,0,0,0,25]
};

function userBat(m,L){
 const n=m.inn[m.cur],dW=(TEAMS[n.bw].bo-TEAMS[n.bt].ba)/100*.4,p=L.press;
 const inStumps=M.abs(L.endX)<.32&&L.by>.35;
 if(!p){
  // Missed/left the ball
  if(inStumps&&rnd()<.42)return{r:0,w:1,k:'b',timing:'LATE!'};
  return{r:0,w:0,timing:'LEFT'};
 }
 // Ideal hit time is when ball reaches crease (t == L.dur)
 const err=(p.t-L.dur)/.17;
 if(M.abs(err)>1.08){
  if(inStumps&&rnd()<.36+dW)return{r:0,w:1,k:'b',timing:err<0?'TOO EARLY!':'TOO LATE!'};
  return{r:0,w:0,timing:err<0?'EARLY!':'LATE!'};
 }
 const sh=p.shot;
 let q=1-M.abs(err)*.78;
 // Bonus for matching shot direction with ball line/length
 if(sh=='L'&&L.endX<=.05)q+=.16;
 else if(sh=='R'&&L.endX>=-.05)q+=.16;
 else if(sh=='U'&&L.by>.35)q+=.14;
 else if(sh=='D')q+=.15;
 else q-=.1;
 q=cl(q,0,1);
 const tier=q>.74?2:q>.46?1:0;
 const k=(sh=='U'?'U':sh=='D'?'D':'G')+tier;
 const w=TB[k].slice();
 w[6]*=M.max(.2,1+dW*1.8);
 const o=outFrom(pickW(w));
 if(o.w)o.k=sh=='U'?'c':(tier==0&&inStumps&&rnd()<.6)?'b':'c';
 o.timing=tier==2?'PERFECT!':tier==1?'GOOD':'OK';
 return o;
}

// ---------- competitions ----------
function newComp(type,fmt){
 const oth=shuf(TEAMS.map((_,i)=>i).filter(i=>i!=S.team));let groups;
 if(type=='tour')groups=[[S.team,...oth.slice(0,5)]];
 else{const all=shuf([S.team,...oth]);groups=[all.slice(0,4),all.slice(4)]}
 const fix=[];groups.forEach(g=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)fix.push({a:g[i],b:g[j],w:null})});
 return{kind:'comp',type,fmt,groups,fix:shuf(fix),stage:'L',ko:[],champ:-1};
}
function tbl(c,g){
 return g.map(t=>{
  let p=0,w=0,pt=0;
  for(const f of c.fix)if(f.w!=null&&(f.a==t||f.b==t)){p++;if(f.w==t){w++;pt+=2}else if(f.w<0)pt++}
  return{t,p,w,pt};
 }).sort((x,y)=>y.pt-x.pt||y.w-x.w||(TEAMS[y.t].ba+TEAMS[y.t].bo)-(TEAMS[x.t].ba+TEAMS[x.t].bo));
}
function recFix(c,f,m){f.w=m.res.w;f.t=m.res.t;if(f.w<0&&c.stage!='L'){f.w=rnd()<.5?f.a:f.b;f.t+=' (super over: '+TEAMS[f.w].c+')'}}
function compAdv(c){
 for(;;){
  const L=c.stage=='L'?c.fix:c.ko,nx=L.find(f=>f.w==null);
  if(nx){if(nx.a==S.team||nx.b==S.team)return nx;recFix(c,nx,simMatch(nx.a,nx.b,c.fmt));continue}
  if(c.stage=='L'){
   const q=c.groups.map(g=>tbl(c,g).map(r=>r.t));
   c.ko=c.groups.length==1?[{a:q[0][0],b:q[0][3],w:null},{a:q[0][1],b:q[0][2],w:null}]:[{a:q[0][0],b:q[1][1],w:null},{a:q[1][0],b:q[0][1],w:null}];
   c.stage='S';continue;
  }
  if(c.stage=='S'){c.ko=[{a:c.ko[0].w,b:c.ko[1].w,w:null}];c.stage='F';continue}
  if(c.stage=='F'){c.champ=c.ko[0].w;c.stage='D'}
  return null;
 }
}

// ---------- Nokia Cricket Cup Live Match State ----------
let lv=null;
// Outfield 9 fielder base positions (normalized to oval radius)
const FLD_BASE=[
 [-.42,.22],[.42,.22],[-.76,-.05],[.76,-.05],
 [-.38,-.52],[.38,-.52],[.02,-.78],[-.58,.58],[.58,.58]
];

function startLive(ctx,first){
 const m=newMatch(ctx.a,ctx.b,ctx.fmt,first);
 lv={m,ctx,u:ctx.a,ph:'ready',t:0,shot:'U',bx:0,by:.55,swing:0,ci:0,msg:'',big:'',bigT:0};
 st='play';hideUI();root.classList.add('pl');beginBall();
}
const bats=()=>lv.m.inn[lv.m.cur].bt==lv.u;

function beginBall(){
 const L=lv;
 L.press=null;L.out=null;L.acc=0;L.big='';L.bounced=false;L.stepTick=0;
 $('#ok').textContent=bats()?'HIT':'BOWL';
 if(bats()){
  L.ph='runup';L.t=0;
  // AI bowler picks bounce spot (bx: -0.7..0.7, by: 0.18..0.88)
  L.bx=(rnd()-.5)*1.15;
  L.by=.2+rnd()*.68;
  L.swing=(rnd()-.5)*.45;
  L.endX=cl(L.bx+L.swing*(1-L.by*.4),-1.1,1.1);
  if(L.shot=='D')L.shot='U';
 }else{
  L.ph='spot';L.t=0;
  // Keep user's last spot or center it
  L.bx=cl(L.bx,-.85,.85);L.by=cl(L.by,.15,.9);
 }
}

function startBowlRunup(){
 const L=lv;
 L.ph='runup';L.t=0;
 L.swing=(L.bx>0?-.22:.22)+(rnd()-.5)*.2;
 L.endX=cl(L.bx+L.swing*(1-L.by*.4),-1.1,1.1);
}

function release(){
 const L=lv;
 L.ph='flight';L.t=0;
 // Duration depends slightly on delivery length
 L.dur=.82+rnd()*.16+(L.by<.35?.12:0);
 L.bounced=false;
 sfx.whoosh();
}

function okPress(){
 if(st!='play'||!lv)return;
 const L=lv;
 if(bats()){
  if(L.ph=='flight'&&!L.press){
   L.press={t:L.t,shot:L.shot};
   // If ball is very close to crease, resolve immediately on swing completion
  }else if(L.ph=='runup'&&L.t>.25){
   // Allow impatient tap to speed up runup slightly
  }else if(L.ph=='outfield'||L.ph=='pitch_res'){
   if(L.t>.65)L.t=9;
  }
 }else{
  if(L.ph=='spot'){
   sfx.tick();L.ph='aim';L.t=0;L.meter=.5;
  }else if(L.ph=='aim'){
   L.acc=1-M.abs(L.meter-.5)*2;
   sfx.tick();startBowlRunup();
  }else if(L.ph=='outfield'||L.ph=='pitch_res'){
   if(L.t>.65)L.t=9;
  }
 }
}

function choose(k){
 if(st!='play'||!lv)return;
 const L=lv;sfx.tick();
 if(bats()){
  L.shot=k;
  // If ball is already right at the hitting zone and player presses a direction, also trigger swing!
  if(L.ph=='flight'&&!L.press&&L.t>=L.dur-.18&&L.t<=L.dur+.15){
   L.press={t:L.t,shot:k};
  }
 }else if(L.ph=='spot'){
  const dx=k=='L'?-.16:k=='R'?.16:0;
  const dy=k=='U'?-.11:k=='D'?.11:0;
  L.bx=cl(L.bx+dx,-.85,.85);
  L.by=cl(L.by+dy,.15,.92);
 }
}

function resolve(){
 const L=lv,m=L.m;let o;
 if(bats())o=userBat(m,L);
 else o=userBowl(m,L.bx,L.by,L.acc);
 L.out=o;L.t=0;

 const sh=bats()?(L.press?L.press.shot:'D'):['L','R','U','L','R'][rnd()*5|0];
 L.usedShot=sh;

 // Did the ball get hit into the outfield, or stay on the pitch (bowled / missed / defended at crease)?
 const stayedOnPitch=(o.w&&o.k=='b')||(!o.w&&o.r==0&&(!L.press&&bats()||sh=='D'));

 if(stayedOnPitch){
  L.ph='pitch_res';
  L.resDur=1.55;
 }else{
  // Switch to Nokia Cricket Cup Outfield View!
  L.ph='outfield';
  L.resDur=2.15;
  let ang=sh=='L'?M.PI*(.78+(rnd()-.5)*.45):sh=='R'?M.PI*(.22+(rnd()-.5)*.45):M.PI*(.5+(rnd()-.5)*.35);
  if(!bats())ang=rnd()*M.PI*2;
  const vx=M.cos(ang),vy=M.sin(ang); // vy>0 is down screen, vy<0 is up screen
  // Choose a natural direction vector
  const dirX=sh=='L'?-(.55+rnd()*.4):sh=='R'?(.55+rnd()*.4):(rnd()-.5)*.7;
  const dirY=sh=='U'?-(.65+rnd()*.35):(rnd()-.35)*.8;
  const len=M.hypot(dirX,dirY)||1,ux=dirX/len,uy=dirY/len;

  const distFactor=o.w?.58:o.r==6?1.18:o.r==4?1.03:o.r==3?.82:o.r==2?.64:o.r==1?.42:.22;
  const ORX=390,ORY=205,OCX=480,OCY=285;
  let tx=OCX+ux*ORX*distFactor,ty=OCY+uy*ORY*distFactor;

  // Initialize fielders for this play
  L.flds=FLD_BASE.map(([fx,fy])=>({x:OCX+fx*ORX,y:OCY+fy*ORY}));
  L.chaser=0;
  let bestD=1e9;
  L.flds.forEach((f,idx)=>{
   const d=M.hypot(f.x-tx,f.y-ty);
   if(d<bestD){bestD=d;L.chaser=idx}
  });
  if(o.w&&o.k=='c'){
   tx=L.flds[L.chaser].x+(rnd()-.5)*28;
   ty=L.flds[L.chaser].y+(rnd()-.5)*20;
  }
  L.dest=[tx,ty];
 }

 if(o.w){
  L.big='OUT!';
  L.msg=o.k=='b'?'CLEAN BOWLED!':'CAUGHT OUT!';
  sfx.out();
 }else if(o.r==6){
  L.big='SIX!';L.msg='HUGE MAXIMUM!';sfx.bigHit();sfx.cheer();
 }else if(o.r==4){
  L.big='FOUR!';L.msg='CRACKING BOUNDARY!';sfx.hit();sfx.cheer();
 }else{
  L.big=o.r?o.r+' RUN'+(o.r>1?'S':''):'';
  L.msg=o.r?o.r+(o.r>1?' runs':' run')+(o.timing?' ('+o.timing+')':''):'No run'+(o.timing?' · '+o.timing:'');
  if(L.press||!bats()){if(o.r>0||sh!='D')sfx.hit();else sfx.step()}
 }
 L.bigT=1.45;
}

function commit(){
 const L=lv,m=L.m,b=m.cur;
 applyBall(m,L.out);
 if(m.done)return endLive();
 if(m.cur!=b)return inningsBreak();
 beginBall();
}
function inningsBreak(){
 const m=lv.m,p=m.inn[m.cur-1];st='brk';root.classList.remove('pl');lv.ci=m.cur;const n=m.inn[m.cur];
 panel(`<h2>INNINGS BREAK</h2><p>${TEAMS[p.bt].c} ${p.r}/${p.w} (${ovs(p.b)})</p>${n.target?`<p>${TEAMS[n.bt].c} need ${n.target} to win</p>`:''}<p>${bats()?'You bat next':'You bowl next'}</p>${B('brk','CONTINUE')}`,'brk');
}
function endLive(){const L=lv;st='brk';onMatch(L.ctx,L.m)}
function simLive(kind){
 const L=lv,m=L.m,c0=m.cur,g=kind=='over'?6-m.inn[m.cur].b%6:kind=='five'?30:1e9;
 for(let i=0;i<g&&!m.done&&m.cur==c0;i++)applyBall(m,simBall(m));
 if(m.done)return endLive();if(m.cur!=c0)return inningsBreak();
 st='play';hideUI();root.classList.add('pl');beginBall();
}
function pause(){
 if(st=='play'){st='pause';panel(`<h2>PAUSED</h2>${B('resume','RESUME')}${B('s1','SIM THIS OVER')}${B('s5','SIM 5 OVERS')}${B('sinn','SIM INNINGS')}${B('menu','QUIT MATCH')}`)}
 else if(st=='pause'){st='play';hideUI()}
}
function quit(){const L=lv;if(!L)return menu();const m={res:{w:L.ctx.b,t:'Match forfeited'},inn:[]};L.ctx.done(m);st='brk';(L.ctx.next||menu)()}

function liveUpd(dt){
 const L=lv;if(!L||st!='play')return;
 L.t+=dt;if(L.bigT>0)L.bigT-=dt;
 if(L.ph=='runup'){
  if(L.t>L.stepTick){L.stepTick+=.14;sfx.step()}
  if(L.t>=.72)release();
 }else if(L.ph=='aim'){
  L.meter=(M.sin(L.t*3.8)+1)/2;
 }else if(L.ph=='flight'){
  const p=L.t/L.dur;
  const pb=.18+L.by*.66;
  if(!L.bounced&&p>=pb){L.bounced=true;sfx.bounce()}
  if(L.t>=L.dur+.15)resolve();
 }else if(L.ph=='pitch_res'||L.ph=='outfield'){
  if(L.ph=='outfield'&&L.flds){
   // Move chasing fielder toward ball destination
   const ch=L.flds[L.chaser],tx=L.dest[0],ty=L.dest[1];
   const dx=tx-ch.x,dy=ty-ch.y,d=M.hypot(dx,dy);
   if(d>4){ch.x+=dx/d*dt*155;ch.y+=dy/d*dt*155}
  }
  if(L.t>=L.resDur)commit();
 }
}

function nav(dx,dy){
 const bs=[...ui.querySelectorAll('.b')];if(!bs.length)return;
 const cur=document.activeElement;if(!bs.includes(cur)){bs[0].focus();return}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=1e9;
 for(const b of bs){
  if(b===cur)continue;
  const p=b.getBoundingClientRect(),x=p.left+p.width/2-cx,y=p.top+p.height/2-cy,pr=x*dx+y*dy;
  if(pr<=2)continue;
  const s=pr+(M.abs(x*dy)+M.abs(y*dx))*2;if(s<bd){bd=s;best=b}
 }
 if(best)best.focus();
}

function clickFocus(){const a=document.activeElement,b=a&&a.classList&&a.classList.contains('b')?a:ui.querySelector('.b');if(b)b.click()}
const DIRS={ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R'},BACKS=[10009,461,8,27,166];

addEventListener('keydown',e=>{
 au();
 if(!ld.hidden){if(e.code=='Enter'){const b=ld.querySelector('button');if(b)b.click()}return}
 if(BACKS.includes(e.keyCode)||e.code=='Escape'||e.code=='BrowserBack'||e.code=='GoBack'){e.preventDefault();back();return}

 }

  else if(e.code=='Enter'||e.code=='NumpadEnter'||e.code=='Space'){e.preventDefault();okPress()}
 }
});

// ---------- Nokia "Cricket Cup" Graphics Engine ----------
// Pitch 3D Perspective Geometry (matches screenshot!)
const PY_TOP=148, PY_BOT=525;
const PW_TOP=132, PW_BOT=320;
const CREASE_TOP=182, CREASE_BOT=462;
const STUMP_TOP_Y=166, STUMP_BOT_Y=474;

// Map normalized pitch coordinates (u in [-1..1], v in [0..1]) to screen [x, y, scale]
function pitchProj(u,v){
 // Perspective foreshortening curve
 const vp=M.pow(cl(v,0,1.25),1.18);
 const y=CREASE_TOP+(CREASE_BOT-CREASE_TOP)*vp;
 const halfW=(PW_TOP+(PW_BOT-PW_TOP)*vp)*0.5;
 const x=W/2+u*halfW;
 const sc=0.46+0.54*vp;
 return[x,y,sc];
}

// Compute 3D Ball Position during Flight on Pitch View
function calcBallPitch(L){
 const p=cl(L.t/L.dur,0,1);
 const pb=.18+L.by*.66; // Normalized time of bounce at Red X
 // Interpolate u (horizontal line) and v (depth along pitch)
 let u,v,z;
 if(p<=pb){
  const k=p/pb;
  u=0.06+(L.bx-0.06)*k;
  v=L.by*k;
  // Parabolic drop from bowler's hand (z=42) to ground (z=0) at bounce
  z=42*(1-k*k);
 }else{
  const k=(p-pb)/(1-pb);
  u=L.bx+(L.endX-L.bx)*k;
  v=L.by+(1.02-L.by)*k;
  // Bounce height depends on length: short balls bounce high, yorkers stay low
  const maxBounce=L.by<.32?48:L.by>.82?10:28;
  z=maxBounce*M.sin(M.PI*k*.88);
 }
 const[sx,sy,sc]=pitchProj(u,v);
 const r=4.5+sc*7.5;
 return{sx,sy:sy-z*sc,groundY:sy,r,sc,p,pb};
}

  // 3. Red 'X' Bounce Marker on Pitch (matches screenshot!)
  if(L){
   const[xx,xy,xsc]=pitchProj(L.bx,L.by);
   const pulse=L.ph=='spot'?1+.15*M.sin(L.t*10):1;
   drawRedX(xx,xy,xsc,pulse);
   if(L.ph=='spot'){
    // Aiming crosshair rings around Red X when bowling
    X.strokeStyle='#ffeb3b';X.lineWidth=2;
    X.beginPath();X.ellipse(xx,xy,24*xsc,14*xsc,0,0,7);X.stroke();
   }
  }else{
   // Menu demo preview X
   const[xx,xy,xsc]=pitchProj(0,.52);
   drawRedX(xx,xy,xsc,1);
  }

  // 4. Batting Timing Target Ring near popping crease
  if(L&&bats()&&(L.ph=='runup'||L.ph=='flight')){
   const[tx,ty]=pitchProj(L.endX,1.0);
   const rem=L.ph=='flight'?M.abs(L.dur-L.t):.6;
   const inZone=L.ph=='flight'&&rem<.15;
   X.strokeStyle=inZone?'#76ff03':'rgba(255,255,255,0.45)';
   X.lineWidth=inZone?4:2;
   X.beginPath();X.ellipse(tx,ty,26,13,0,0,7);X.stroke();
   if(L.ph=='flight'){
    const ringR=cl(rem*95,12,75);
    X.strokeStyle=inZone?'#ffeb3b':'rgba(255,235,59,0.55)';
    X.lineWidth=2;
    X.beginPath();X.ellipse(tx,ty,ringR,ringR*.5,0,0,7);X.stroke();
   }
  }

  // 5. Ball in Flight on Pitch
  if(L&&L.ph=='flight'){
   const B=calcBallPitch(L);
   // Shadow on pitch directly below ball
   X.fillStyle='rgba(0,0,0,0.38)';
   X.beginPath();X.ellipse(B.sx,B.groundY,B.r*.95,B.r*.48,0,0,7);X.fill();
   // Red Cricket Ball with white seam
   X.fillStyle='#d50000';
   X.beginPath();X.arc(B.sx,B.sy,B.r,0,7);X.fill();
   X.fillStyle='#ff8a80';
   X.beginPath();X.arc(B.sx-B.r*.3,B.sy-B.r*.3,B.r*.28,0,7);X.fill();
   X.strokeStyle='#ffffff';X.lineWidth=1.5;
   X.beginPath();X.arc(B.sx,B.sy,B.r*.75,-.6,.9);X.stroke();
  }

  // 6. Batsman at Bottom-Left of Stumps
  drawBatsman(L,bt.col,bt.acc);

  // 7. Bottom Stumps (in foreground just like the Nokia screenshot!)
  const isBowled=L&&L.ph=='pitch_res'&&L.out&&L.out.w&&L.out.k=='b';
  drawStumpsBot(isBowled,L?L.t:0);

  // Ball resting or deflecting on pitch_res
  if(L&&L.ph=='pitch_res'&&!isBowled){
   const[bx,by]=pitchProj(L.endX,1.02+L.t*.15);
   X.fillStyle='#d50000';X.beginPath();X.arc(bx,by-6,10,0,7);X.fill();
  }

  // 8. Bowling Power/Accuracy Meter
  if(L&&L.ph=='aim'){
   const mx=W/2-170,my=H-78;
   X.fillStyle='#051207ee';X.fillRect(mx-6,my-8,352,34);
   X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(mx-6,my-8,352,34);
   const g=X.createLinearGradient(mx,0,mx+340,0);
   g.addColorStop(0,'#d32f2f');g.addColorStop(.38,'#fbc02d');g.addColorStop(.5,'#00e676');g.addColorStop(.62,'#fbc02d');g.addColorStop(1,'#d32f2f');
   X.fillStyle=g;X.fillRect(mx,my,340,18);
   X.fillStyle='#ffffff';X.fillRect(mx+L.meter*340-4,my-6,8,30);
  }
 }

 // HUD & Big Popups
 if(L){
  hudWrap(L,m,n,bt,bw);
  if(L.bigT>0&&L.big){
   X.save();
   const s=1+(1.45-L.bigT)*.25;
   X.translate(W/2,H/2-20);X.scale(s,s);
   txt(L.big,0,0,76,'center',L.big=='OUT!'?'#ff1744':'#ffeb3b');
   if(L.out&&L.out.timing&&!L.out.w)txt(L.out.timing,0,42,26,'center','#76ff03');
   X.restore();
  }
 }
}

function hudWrap(L,m,n,bt,bw){
 drawNokiaHUD(L,m,n,bt,bw);
}

let last=0;
function loop(ts){
 requestAnimationFrame(loop);
 const dt=M.min(.05,(ts-last)/1000||0);last=ts;
 pad();liveUpd(dt);draw();
}
menu();requestAnimationFrame(loop);
})();
</script></body></html>
