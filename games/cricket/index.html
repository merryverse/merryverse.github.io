// ---------- audio ----------
let AC;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function tone(f,d,ty='square',v=.06,sl=0,w=0){if(!AC||S.mute)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+w;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(M.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function noise(d,v){if(!AC||S.mute)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(rnd()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start()}
const sfx={whoosh:()=>tone(300,.3,'sine',.03,400),hit:()=>{tone(180,.08,'square',.1,-120);tone(1300,.04,'square',.04)},cheer:()=>noise(1.1,.12),out:()=>{tone(400,.4,'sawtooth',.08,-300);noise(.3,.1)},tick:()=>tone(660,.04,'square',.04),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.1,0,i*.15))};
// ---------- teams ----------
const TEAMS=[['Bangladesh','BAN',76,75,'#0a8f4e'],['India','IND',88,86,'#1f6fe0'],['Pakistan','PAK',83,85,'#14a05a'],['Australia','AUS',87,87,'#f2c200'],['England','ENG',86,82,'#d0143c'],['South Africa','RSA',84,86,'#2db35c'],['New Zealand','NZL',80,83,'#566074'],['Sri Lanka','SRI',75,76,'#3558c8']].map(([n,c,ba,bo,col])=>({n,c,ba,bo,col}));
const FN=['Aman','Rahim','Tariq','Sami','Liam','Noor','Arif','Zayn','Ravi','Omar','Jake','Hasan','Kofi','Imran','Yash','Dev','Finn','Ali','Mehedi','Tom','Sam','Raza','Ben','Naim'],LN=['Khan','Das','Smith','Ahmed','Patel','Jones','Hossain','Silva','Brown','Malik','Rao','Taylor','Islam','Perera','Wood','Sharma','Lee','Nair','Cook','Shah'];
const pn=(t,i)=>FN[(t*7+i*5+3)%FN.length][0]+'. '+LN[(t*11+i*3+i*i)%LN.length];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ovs=b=>(b/6|0)+'.'+b%6,FMT={T20:'T20',ODI:'ONE DAY',TEST:'TEST'};
// ---------- match engine ----------
function newMatch(a,b,fmt,first){const o=first==a?b:a;const m={fmt,a,b,ord:fmt=='TEST'?[first,o,first,o]:[first,o],cur:0,inn:[],maxB:{T20:120,ODI:300,TEST:0}[fmt],done:false,res:null,tb:0};startInn(m);return m}
function startInn(m){const bt=m.ord[m.cur],bw=bt==m.a?m.b:m.a;let target=null;
 if(m.fmt!='TEST'&&m.cur==1)target=m.inn[0].r+1;
 if(m.fmt=='TEST'&&m.cur==3)target=m.inn[0].r+m.inn[2].r-m.inn[1].r+1;
 m.inn.push({bt,bw,r:0,w:0,b:0,target,bat:[...Array(11)].map(()=>({r:0,b:0,o:0,h:''})),st:0,ns:1,nx:2,ov:[],fow:[]})}
function applyBall(m,o){const n=m.inn[m.cur],s=n.bat[n.st];n.b++;m.tb++;s.b++;n.r+=o.r;s.r+=o.r;n.ov.push(o.w?'W':o.r);
 if(o.w){n.w++;s.o=1;s.h=o.k;n.fow.push(n.r);if(n.w<10)n.st=n.nx++}else if(o.r%2){const t=n.st;n.st=n.ns;n.ns=t}
 if(n.b%6==0){const t=n.st;n.st=n.ns;n.ns=t;n.ov=[]}
 let end=n.w>=10||(m.maxB&&n.b>=m.maxB)||(n.target&&n.r>=n.target);
 if(m.fmt=='TEST'&&m.tb>=2700&&!end){end=true;m.cap=true}
 if(end)endInn(m);return end}
function endInn(m){const T=m.fmt=='TEST';m.cur++;
 if((!T&&m.cur>=2)||(T&&m.cur>=4)||m.cap)return finish(m);
 if(T&&m.cur==3&&m.inn[0].r+m.inn[2].r<=m.inn[1].r){m.by=1;return finish(m)}
 startInn(m)}
function finish(m){m.done=true;const T=m.fmt=='TEST',c=t=>TEAMS[t].c;let w=-1,t='';
 if(!T){const f=m.inn[0],s=m.inn[1];if(s.r>=s.target){w=s.bt;t=c(w)+' won by '+(10-s.w)+' wickets'}else if(s.r==f.r)t='Match tied';else{w=f.bt;t=c(w)+' won by '+(f.r-s.r)+' runs'}}
 else if(m.by){w=m.ord[1];t=c(w)+' won by an innings and '+(m.inn[1].r-m.inn[0].r-m.inn[2].r)+' runs'}
 else if(m.cap||m.inn.length<4)t='Match drawn';
 else{const f=m.inn[3];if(f.r>=f.target){w=f.bt;t=c(w)+' won by '+(10-f.w)+' wickets'}else if(f.r==f.target-1)t='Match tied';else{w=m.ord[0];t=c(w)+' won by '+(f.target-1-f.r)+' runs'}}
 m.res={w,t}}
function aggr(m){const n=m.inn[m.cur],ov=n.b/6,F=m.fmt;let a=1;
 if(F=='T20')a=ov<6?1.15:ov>=16?1.3:1;else if(F=='ODI')a=ov<10?.9:ov>=40?1.35:1;
 if(n.target&&F!='TEST'){const left=m.maxB-n.b,rr=(n.target-n.r)/M.max(1,left)*6,cr=n.b?n.r/n.b*6:rr;if(rr>cr+2)a*=1.3;else if(rr<cr-1.5)a*=.85}
 if(F=='TEST'&&n.target)a=1.1;return a}
function wts(m,adjBat=0,adjBowl=0){const n=m.inn[m.cur],d=(TEAMS[n.bt].ba+adjBat-(TEAMS[n.bw].bo+adjBowl))/40,a=aggr(m);
 const b={T20:[34,33,8,1,10,5,4.5],ODI:[38,36,8,1,8,2.5,2.8],TEST:[60,24,3.5,.5,5.5,.5,1.6]}[m.fmt];
 return[b[0]*(1-d*.3)/M.sqrt(a),b[1],b[2],b[3],b[4]*(1+d*.9)*a,b[5]*(1+d*1.1)*a,b[6]*(1-d*.8)*(.9*a+.1)]}
function pickW(w){const t=w.reduce((a,b)=>a+M.max(0,b),0);let r=rnd()*t;for(let i=0;i<w.length;i++){r-=M.max(0,w[i]);if(r<=0)return i}return 0}
const VAL=[0,1,2,3,4,6],outFrom=i=>i==6?{r:0,w:1,k:rnd()<.6?'c':'b'}:{r:VAL[i],w:0};
const simBall=m=>outFrom(pickW(wts(m)));
function simMatch(a,b,fmt){const m=newMatch(a,b,fmt,rnd()<.5?a:b);let g=0;while(!m.done&&g++<20000)applyBall(m,simBall(m));return m}
function userBowl(m,dl,acc){const adj=(acc-.5)*50+(dl!='G'?5:0),w=wts(m,0,adj);
 if(dl=='Y'||dl=='B'){w[6]*=1.3;w[4]*=1.2;w[5]*=1.15;if(acc<.5){w[4]*=1.4;w[5]*=1.5}}
 if(acc<.3){w[4]*=1.5;w[5]*=1.4}return outFrom(pickW(w))}
const TB={G2:[2,10,12,0,70,3,3],G1:[8,32,28,2,22,0,8],G0:[30,28,12,0,2,0,28],U2:[0,0,3,0,30,62,5],U1:[0,6,6,0,22,22,44],U0:[10,10,5,0,0,0,75],D2:[55,38,5,0,0,0,2],D1:[50,38,6,0,2,0,4],D0:[48,25,2,0,0,0,25]};
function userBat(m,L){const n=m.inn[m.cur],dW=(TEAMS[n.bw].bo-TEAMS[n.bt].ba)/100*.5,p=L.press,ls=L.line<-.3?-1:L.line>.3?1:0;
 if(!p)return Object.assign(rnd()<(ls==0?.22:.06)?{r:0,w:1,k:'b'}:{r:0,w:0},{miss:1});
 const err=(p.t-L.dur)/.16;if(M.abs(err)>1)return Object.assign(rnd()<.3+dW?{r:0,w:1,k:'b'}:{r:0,w:0},{miss:1});
 const sh=p.shot;let q=1-M.abs(err)*.8;
 if(sh=='L')q+=ls==-1?.12:-.12;else if(sh=='R')q+=ls==1?.12:-.12;else if(sh=='U')q+=ls==0?.12:-.1;
 if(L.len<.55){if(sh=='L'||sh=='R')q+=.1;else if(sh=='U')q-=.1}else if(L.len>.74){if(sh=='D')q+=.15;else if(sh=='U')q-=.12}
 q=cl(q,0,1);const k=(sh=='U'?'U':sh=='D'?'D':'G')+(q>.78?2:q>.5?1:0),w=TB[k].slice();w[6]*=M.max(.2,1+dW*2);
 const o=outFrom(pickW(w));if(o.w)o.k=sh=='U'?'c':rnd()<.5?'b':'c';return o}
// ---------- competitions ----------
function newComp(type,fmt){const oth=shuf(TEAMS.map((_,i)=>i).filter(i=>i!=S.team));let groups;
 if(type=='tour')groups=[[S.team,...oth.slice(0,5)]];else{const all=shuf([S.team,...oth]);groups=[all.slice(0,4),all.slice(4)]}
 const fix=[];groups.forEach((g,gi)=>{for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)fix.push({a:g[i],b:g[j],w:null})});
 return{kind:'comp',type,fmt,groups,fix:shuf(fix),stage:'L',ko:[],champ:-1}}
function tbl(c,g){return g.map(t=>{let p=0,w=0,pt=0;for(const f of c.fix)if(f.w!=null&&(f.a==t||f.b==t)){p++;if(f.w==t){w++;pt+=2}else if(f.w<0)pt++}return{t,p,w,pt}}).sort((x,y)=>y.pt-x.pt||y.w-x.w||(TEAMS[y.t].ba+TEAMS[y.t].bo)-(TEAMS[x.t].ba+TEAMS[x.t].bo))}
function recFix(c,f,m){f.w=m.res.w;f.t=m.res.t;if(f.w<0&&c.stage!='L'){f.w=rnd()<.5?f.a:f.b;f.t+=' (super over: '+TEAMS[f.w].c+')'}}
function compAdv(c){for(;;){const L=c.stage=='L'?c.fix:c.ko,nx=L.find(f=>f.w==null);
 if(nx){if(nx.a==S.team||nx.b==S.team)return nx;recFix(c,nx,simMatch(nx.a,nx.b,c.fmt));continue}
 if(c.stage=='L'){const q=c.groups.map(g=>tbl(c,g).map(r=>r.t));c.ko=c.groups.length==1?[{a:q[0][0],b:q[0][3],w:null},{a:q[0][1],b:q[0][2],w:null}]:[{a:q[0][0],b:q[1][1],w:null},{a:q[1][0],b:q[0][1],w:null}];c.stage='S';continue}
 if(c.stage=='S'){c.ko=[{a:c.ko[0].w,b:c.ko[1].w,w:null}];c.stage='F';continue}
 if(c.stage=='F'){c.champ=c.ko[0].w;c.stage='D'}return null}}
