let g=X.createRadialGradient(-w*.1,-hh*.1,5,0,0,w*.5);g.addColorStop(0,`hsl(${h},50%,38%)`);g.addColorStop(1,`hsl(${h},60%,6%)`);X.fillStyle=g;X.strokeStyle=c2;X.lineWidth=3;X.beginPath();X.ellipse(0,0,w*.45,hh*.38,0,0,TAU);X.fill();X.stroke();
X.lineWidth=1.5;for(let i=1;i<4;i++){X.beginPath();X.ellipse(0,0,w*.45*(1-i*.2),hh*.38*(1-i*.2),0,0,TAU);X.stroke()}
X.fillStyle=c2;for(const y of[-.28,0,.28]){X.beginPath();X.arc(-w*.4,y*hh,7,0,TAU);X.fill()}
if(L==9){X.strokeStyle='#f4f';X.lineWidth=4;for(let i=0;i<3;i++){X.beginPath();X.arc(-w*.12,0,w*.2+i*14,b.t*(1+i*.5),b.t*(1+i*.5)+2);X.stroke()}}
X.globalCompositeOperation='lighter';const cp=b.cr*(1.5+.3*M.sin(b.t*6));glow(-w*.12,0,cp*1.6,b.ph==2?'#f33':'#ff6',1);X.globalCompositeOperation='source-over';
if(b.sh>0){X.strokeStyle='rgba(90,230,255,.8)';X.lineWidth=4;X.beginPath();X.ellipse(0,0,w*.55,hh*.55,0,0,TAU);X.stroke()}
if(b.fl>0){X.globalAlpha=.5;X.fillStyle='#fff';X.beginPath();X.ellipse(0,0,w*.45,hh*.38,0,0,TAU);X.fill();X.globalAlpha=1}X.restore()}
function dP(){if(P.inv>0&&((P.inv*14)|0)%2)return;const c=SH[S.ship][3];X.save();X.translate(P.x,P.y);X.globalCompositeOperation='lighter';const f=16+rnd()*12;glow(-24-f/4,0,f,'#fa4',.9);glow(-18,0,9,'#fff',.8);X.globalCompositeOperation='source-over';
poly([-22,0,-8,-6,-14,-18,6,-9,26,-3,26,3,6,9,-14,18,-8,6],'#15233a',c);poly([-8,-6,12,-2,12,2,-8,6],c);X.fillStyle='#cff';X.beginPath();X.ellipse(8,0,7,3,0,0,TAU);X.fill();
if(P.sh>0||P.gh>0){X.strokeStyle=P.gh>0?'rgba(255,230,90,.8)':'rgba(90,230,255,.8)';X.lineWidth=3;X.beginPath();X.arc(0,0,30,0,TAU);X.stroke()}X.restore()}
function txt(s,x,y,sz,c='#fff',al='center'){X.font=`bold ${sz}px "Bank Gothic",Eurostile,"Segoe UI",sans-serif`;X.textAlign=al;X.fillStyle=c;X.fillText(s,x,y)}
function draw(){X.save();if(sk>0)X.translate((rnd()-.5)*sk,(rnd()-.5)*sk);dBG();
if(st=='menu'||st=='over'||st=='win'||st=='clear'&&0){X.restore();return}
for(const p of pu){X.globalCompositeOperation='lighter';glow(p.x,p.y,24,'#6f8',.9);X.globalCompositeOperation='source-over';txt(p.k,p.x,p.y+6,16,'#fff')}
for(const e of en)dEn(e);if(bs)dBoss();
for(const z of bz){const on=z.t>z.warn;if(z.gap!==undefined){if(!on){X.fillStyle=`rgba(255,40,40,${.15+.1*M.sin(z.t*20)})`;X.fillRect(0,0,W,z.gap-z.gh/2);X.fillRect(0,z.gap+z.gh/2,W,H);X.fillStyle='rgba(60,255,120,.18)';X.fillRect(0,z.gap-z.gh/2,W,z.gh)}else{X.fillStyle='#fdd';X.fillRect(0,0,W,z.gap-z.gh/2);X.fillRect(0,z.gap+z.gh/2,W,H)}}else{X.fillStyle=on?'rgba(255,200,200,.95)':'rgba(255,40,40,.2)';X.fillRect(0,z.y-(on?z.hh:2),W,on?z.hh*2:4)}}
X.globalCompositeOperation='lighter';
for(const b of pb)glow(b.x,b.y,b.h?14:11,b.c);for(const b of eb)glow(b.x,b.y,b.r*2.8,b.c);
for(const p of pt){if(p.rg){const k=1-p.l/p.m;X.strokeStyle=`rgba(255,200,120,${1-k})`;X.lineWidth=3;X.beginPath();X.arc(p.x,p.y,p.rg*k,0,TAU);X.stroke()}else glow(p.x,p.y,p.s*(p.l/p.m)+2,p.c,M.min(1,p.l*2))}
if(bm){const g=X.createLinearGradient(0,P.y-28,0,P.y+28);g.addColorStop(0,'rgba(80,200,255,0)');g.addColorStop(.5,'#fff');g.addColorStop(1,'rgba(80,200,255,0)');X.fillStyle=g;X.fillRect(P.x,P.y-28,W,56)}
X.globalCompositeOperation='source-over';
for(const b of eb){X.fillStyle='#fff';X.beginPath();X.arc(b.x,b.y,b.r*.5,0,TAU);X.fill()}
dP();
if(L==3){X.globalCompositeOperation='lighter';for(let i=0;i<3;i++){glow((W*(1-((lt*.02+i*.33)%1))),150+i*120,260,'hsl(290,80%,18%)',.5)}X.globalCompositeOperation='source-over'}
X.restore();if(fl>0){X.fillStyle=`rgba(255,255,255,${M.min(1,fl)})`;X.fillRect(0,0,W,H)}hud()}
function bar(x,y,w,h,v,c){X.fillStyle='#0008';X.fillRect(x,y,w,h);X.fillStyle=c;X.fillRect(x,y,w*cl(v,0,1),h);X.strokeStyle='#8cf8';X.lineWidth=1;X.strokeRect(x,y,w,h)}
function hud(){bar(14,14,170,12,P.hp/P.mx,P.hp/P.mx>.3?'#4e8':'#f54');if(P.sh>0)bar(14,30,170,4,P.sh/8,'#5df');txt('LIVES '+M.max(0,P.lives)+'   SHIELD x'+P.shn,14,52,13,'#9cf','left');txt(String(score).padStart(7,'0'),14,76,22,'#fff','left');
const pr=phase=='run'?lt/LEN():1;bar(W/2-130,14,260,7,pr,'#5cf');txt(`LEVEL ${L+1} · ${LV[L][0]}`,W/2,40,13,'#9cf');
txt('HI '+S.hi,W-14,28,16,'#9cf','right');txt(`${P.mode?'SPREAD':'LASER'} Lv${P.wl}  MSL ${P.am}`,W-14,50,13,'#9cf','right');bar(W-134,58,120,6,P.en/100,P.en>=100?'#fff':'#58f');if(P.en>=100)txt('BEAM READY (OK)',W-14,80,12,'#fff','right');
if(bs&&!bs.ent){bar(W/2-250,H-26,500,12,bs.hp/bs.mx,bs.sh>0?'#5df':'#f44');txt(LV[L][2]+(bs.ph?'  ·  PHASE '+(bs.ph+1):''),W/2,H-32,14,'#fcc')}
if(mg.t>0){X.globalAlpha=M.min(1,mg.t*2);const w=mg.a=='WARNING';if(w){X.fillStyle=`rgba(255,0,0,${.2+.15*M.sin(lt*0+mg.t*14)})`;X.fillRect(0,H/2-70,W,140)}txt(mg.a,W/2,H/2-6,w?64:44,w?'#f66':'#fff');txt(mg.b,W/2,H/2+30,22,'#9df');X.globalAlpha=1}}
// ---------- loop ----------
let last=0;function loop(ts){requestAnimationFrame(loop);const dt=M.min(.05,(ts-last)/1000||0);last=ts;pad();if(st=='play')upd(dt);else if(st=='menu'){updBG(dt)}draw()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play')pause()});
initBG();menu();requestAnimationFrame(loop);
})();
</script></body></html>
